name: Free FPL webapp on GitHub Pages
on:
  push:
    branches: [free-github-static-20261010]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fpl-free-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate honest static bridge preview
        run: python scripts/build_static_preview.py
      - name: Fetch recent official FPL fixtures
        run: python scripts/fetch_live_fixtures.py
      - name: Mark GitHub Pages static directory
        run: touch app/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - uses: actions/deploy-pages@v4
