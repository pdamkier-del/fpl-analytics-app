name: Free FPL webapp on GitHub Pages
on:
  push:
    branches: [free-github-static-20261010]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fpl-free-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      snapshot: ${{ steps.publication.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify permanent current-season source checkpoint
        run: python scripts/restore_live_input_checkpoint.py --out work/restored-live-inputs
      - name: Generate honest static bridge preview
        run: python scripts/build_static_preview.py
      - name: Fetch recent official FPL fixtures
        run: python scripts/fetch_live_fixtures.py
      - name: Fetch verified completed GW player history for frozen MM feature preparation
        run: python scripts/fetch_current_gw_history.py
      - name: Calculate independent experimental 6GW xP (not locked PM)
        run: python scripts/build_own_forecast.py
      - name: Prepare verified official GW player-fixture source features
        run: python scripts/build_live_feature_base.py
      - name: Derive recent minutes and starts for official upcoming GW
        run: python scripts/build_gw_recency_features.py
      - name: Audit frozen final model for one actual upcoming gameweek
        run: python scripts/audit_live_one_gw.py
      - name: Publish locked final-model release contract
        run: python scripts/publish_final_model.py
      - name: Build verified position and availability layer
        run: python scripts/build_current_role_status.py
      - name: Apply frozen historical role model to stable current player IDs
        run: python scripts/build_static_role_snapshot.py
      - name: Install locked MM diagnostic requirements (no final-model promotion)
        run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests Flask==3.1.2
      - name: Restore and publish real original-vFinal diagnostic checkpoint
        run: |
          python scripts/current_diagnostic_checkpoint.py restore
          python scripts/locked_numerical_runtime.py scripts/run_live_vfinal_joint_simulation.py --input data_v1_1/derived/live_locked_inputs/2026-27-v1/vfinal_live_full_simulator_input.csv.gz --scope one-match --out data_v1_1/derived/live_locked_inputs/2026-27-v1/one_match_xp.csv.gz
          python scripts/locked_numerical_runtime.py scripts/run_live_vfinal_joint_simulation.py --input data_v1_1/derived/live_locked_inputs/2026-27-v1/vfinal_live_full_simulator_input.csv.gz --scope one-gw --out data_v1_1/derived/live_locked_inputs/2026-27-v1/one_gw_xp.csv.gz
          python scripts/audit_live_vfinal_outputs.py
          python scripts/build_live_vfinal_desktop.py
          python scripts/locked_numerical_runtime.py scripts/validate_live_manager_chain.py
          python scripts/run_live_locked_ts.py
          PYTHONPATH=src python -m pytest -q tests/test_live_vfinal_desktop.py tests/test_live_locked_ts_bridge.py tests/test_run_live_vfinal_joint_simulation.py tests/test_private_manager_service.py tests/test_club_lineup_publication.py tests/test_match_display.py
          python -c "from service.app import original_runtime_ready; assert original_runtime_ready(), 'Private original-Python worker imports failed'"
          node --check app/weekly-app.js
          node --check app/manager-state.js
          node --check app/plan-view.js
          node tests/test_forecast_window.js
          node tests/test_weekly_compute.js
          node tests/test_private_import.js
          node tests/test_private_backup_restore.js
          node tests/test_pipeline_status.js
          node tests/test_weekly_network.js
          node tests/test_classic_manager.js
          node tests/test_classic_profile.js
          node tests/test_catalog_data.js
          node tests/test_match_data.js
          node --check app/match-data.js
          node --check app/classic-catalog.js
          node --check app/classic-fixtures.js
          node tests/test_classic_fixtures.js
          node tests/test_classic_pitch_import.js
          node --check app/classic-manager.js
          node --check app/classic-transfers.js
          node tests/test_manager_rollover.js
      - name: Keep locked model unavailable until separately certified
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("app/final-forecast.json")
          x=json.loads(p.read_text())
          if x.get("locked_model_active"):
              raise ValueError("Do not publish uncertified model in desktop release")
          print("Desktop deploy independent of MM replay reconstruction")
          PY
      - name: Verify official data and app entrypoints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=Path("app")
          files=["locked-forecast.html","overview.html","my-team.html","team-optimizer.html","fixtures-live.html","current-players.html","forecast-center.html","live-model-status.html","forecast-history.html","forecast-live.html","my-team-live.html","own-forecast.html","clubs-live.html","mm-diagnostic.html"]
          for f in files:
              if f in ('my-team.html','team-optimizer.html'):
                  target='my-team-classic.html' if f=='my-team.html' else 'transfers-classic.html'
                  assert 'url='+target in (a/f).read_text(),f
                  assert (a/'manager-state.html').stat().st_size>1000
              elif f in ('current-players.html','clubs-live.html','fixtures-live.html'):
                  target='players-classic.html' if f=='current-players.html' else 'fixtures-classic.html' if f=='fixtures-live.html' else 'clubs-classic.html'
                  assert target in (a/f).read_text(),f
                  assert (a/target).stat().st_size>1000
              elif f == 'overview.html':
                  shell=(a/f).read_text(encoding='utf-8')
                  assert (a/f).stat().st_size>500, f
                  assert 'id="weekly-main"' in shell and 'weekly-app.js' in shell and 'weekly-app.css' in shell, f
              else: assert (a/f).stat().st_size>1000,f
          fixtures=json.loads((a/"live-fixtures.json").read_text())
          people=json.loads((a/"current-players.json").read_text())
          assert len(fixtures["fixtures"])>=200
          assert len(people["players"])>=300
          assert len(people["teams"])==20, 'Expected 20 current Premier League clubs'
          assert all("ep_next" in p for p in people["players"])
          own=json.loads((a/"own-forecast.json").read_text())
          assert own["model"]=="experimental_owned_xp_v0" and own["locked_model_active"] is False
          assert own["data_asof"]==people["fetched_at"]
          assert len(own["players"])>=250
          final=json.loads((a/"final-forecast.json").read_text())
          assert final["model_version"]=="fpl-model-2026-10-09-assembled"
          assert final["data_asof"]==people["fetched_at"]
          audit=json.loads((a/"one-gw-readiness.json").read_text())
          assert audit["source_asof"]==people["fetched_at"] and audit["gw"]==people["next_gw"]
          assert audit["official_fixture_feature_base_ready"]
          source=json.loads((a/"gw-source-features.json").read_text())
          assert source["fixture_count"]==audit["fixture_count"]
          recency=json.loads((a/"gw-recency-features.json").read_text())
          assert recency["observed_at"]==people["fetched_at"] and recency["gw"]==people["next_gw"]
          assert recency["count"]==source["player_fixture_count"]
          assert recency["locked_mm_feature_complete"] is False
          history=json.loads((a/"historical-gw-stats.json").read_text())
          assert history["observed_at"]==people["fetched_at"]
          assert all(gw<people["next_gw"] for gw in history["completed_gws"])
          assert len(history["rows"])>=250*len(history["completed_gws"])
          assert source["certification"]["frozen_MM_feature_complete"] is False
          assert final["locked_model_active"] is False or (len(final["players"])>=250 and all(v=="verified" for v in final["parts"].values()))
          assert any(w["xpts"]>0 for p in own["players"] for w in p["weeks"])
          assert fixtures["fetched_at"]==people["fetched_at"]
          assert fixtures["next_gw"]==people["next_gw"]
          from datetime import datetime,timezone
          observed=datetime.fromisoformat(people["fetched_at"])
          assert 0 <= (datetime.now(timezone.utc)-observed).total_seconds()<600, "Live data older than 10 minutes"
          assert any(m["finished"] for m in fixtures["fixtures"])
          assert any(not m["finished"] for m in fixtures["fixtures"])
          print("VERIFIED CURRENT FPL:", "next GW",people["next_gw"],"games",len(fixtures["fixtures"]),"players",len(people["players"]),"fetched_at",people["fetched_at"])
          PY
      - name: Syntax-check frontend scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          for file in ['locked-forecast.html','forecast-history.html','forecast-live.html','own-forecast.html','forecast-center.html','current-players.html','fixtures-live.html','my-team.html','my-team-live.html','team-optimizer.html','clubs-live.html','mm-diagnostic.html','vfinal-diagnostic.html','my-team-classic.html','player.html','transfers-classic.html']:
              s=(Path('app')/file).read_text()
              scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
              for i,script in enumerate(scripts):
                  if not script.strip(): continue
                  with tempfile.NamedTemporaryFile(suffix='.js',mode='w',encoding='utf8') as t:
                      t.write(script);t.flush()
                      subprocess.run(['node','--check',t.name],check=True)
              print('JS syntax OK:',file)
          PY
      - name: Verify redesigned pages and shared navigation
        run: |
          node --check app/design-v2.js
          python - <<'PY'
          from pathlib import Path
          css=Path('app/design-v2.css').read_text()
          js=Path('app/design-v2.js').read_text()
          assert '.fpl-bottom-nav' in css and '.fpl-appbar' in css
          assert 'aria-current' in js and 'fpl-appbar-search' in js
          assert "href:'clubs-live.html'" in js
          pages=[
            'overview.html','my-team-live.html','own-forecast.html',
            'forecast-live.html','team-optimizer.html','fixtures-live.html',
            'current-players.html','forecast-history.html','mobile.html',
            'live-model-status.html','forecast-center.html','models.html',
            'rankings.html','replay.html','index.html','my-team.html','clubs-live.html','mm-diagnostic.html'
          ]
          for page in pages:
              s=(Path('app')/page).read_text(encoding='utf-8')
              if page=='overview.html':
                  assert 'weekly-app.css' in s and 'weekly-app.js' in s
                  assert all('#'+route in s for route in ['dashboard','fixtures','players','chips','model'])
                  assert 'my-team-classic.html' in s and 'transfers-classic.html' in s
                  assert 'classic-nav.js' in s
                  continue
              if page in ('rankings.html','current-players.html','clubs-live.html','fixtures-live.html'):
                  target='clubs-classic.html' if page=='clubs-live.html' else 'fixtures-classic.html' if page=='fixtures-live.html' else 'players-classic.html'
                  assert target in s and 'location.replace' in s,page
                  classic=(Path('app')/target).read_text()
                  assert 'classic-nav.js' in classic and ('classic-fixtures.js' if page=='fixtures-live.html' else 'classic-catalog.js') in classic
                  continue
              assert s.count('design-v2.css?v=2')==1,page
              assert s.count('design-v2.js?v=2')==1,page
              assert s.index('design-v2.css?v=2')<s.index('</head>'),page
              assert s.index('design-v2.js?v=2')<s.index('</body>'),page
          print('DESIGN VERIFIED:',len(pages),'responsive app pages')
          PY
      - name: Verify hard availability presentation by GW
        run: |
          node --check app/availability-ui.js
          node scripts/test_availability_ui.cjs
      - name: Test real FPL squad and formation rules
        run: node scripts/test_live_squad_rules.cjs
      - name: Mark GitHub Pages static directory
        run: touch app/.nojekyll
      - name: Publish cutoff-matched weekly display and TC assets
        run: python scripts/publish_weekly_assets.py
      - name: Trace Le Fee raw offensive rates and allocation (read-only)
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          base=Path('data_v1_1/derived/live_locked_inputs/2026-27-v1')
          for name in ['vfinal_live_full_simulator_input.csv.gz','vfinal_live_joined_inputs.csv.gz','vfinal_player_event_components_6gw.csv.gz','future_team_goal_lambdas.csv.gz']:
              p=base/name
              if not p.exists():
                  print('TRACE_MISSING',name);continue
              df=pd.read_csv(p,low_memory=False)
              print('TRACE_FILE',name,'rows',len(df),'columns',list(df.columns))
              if 'fpl_element' in df:
                  sub=df[df.fpl_element.eq(542)]
                  print('TRACE_PLAYER_ID_542',len(sub))
                  # Identify player by FPL id after reading official bootstrap.
              if 'player_uuid' in df:
                  fid='fpl_element' if 'fpl_element' in df else None
                  ids=sorted(df[fid].dropna().unique()) if fid else []
                  # The frozen FPL ID is read from the forecast, no model change.
                  if fid:
                      sub=df[df[fid].eq(542)]
                      cols=[c for c in ['fpl_element','target_gw','gw','team_id','opponent_team_id','expected_minutes','control_xmins','goal_rate90','assist_rate90','goal_role_prior90','assist_role_prior90','goal_mu','assist_mu','lambda_home_goals','lambda_away_goals','assist_probability_per_goal','perf_last_xgi','perf_last_sot','perf_last_chances'] if c in df]
                      print('TRACE_SELECTED',name,sub[cols].head(6).to_json(orient='records') if cols else 'none')
          PY
      - name: Deep Le Fee and Sunderland source attribution (read-only)
        run: |
          python - <<'PY'
          import pandas as pd, json
          from pathlib import Path
          b=Path('data_v1_1/derived/live_locked_inputs/2026-27-v1')
          f=pd.read_csv(b/'vfinal_live_full_simulator_input.csv.gz')
          p=f[(f.fpl_element==542)].sort_values('target_gw')
          print('DEEP_LEFEE',p[['target_gw','player','expected_minutes','goal_rate90','assist_rate90','goal_role_prior90','assist_role_prior90','goal_mu','assist_mu','lambda_home_goals','lambda_away_goals','home_team_id','away_team_id','perf_last_xgi','perf_last_chances','history_rows']].to_json(orient='records'))
          for _,r in p.iterrows():
              team=f[(f.fixture_uuid==r.fixture_uuid)&(f.team_id==r.team_id)]
              team_lambda=float(r.lambda_home_goals if r.team_id==r.home_team_id else r.lambda_away_goals)
              leaders=team.sort_values('goal_mu',ascending=False)[['player','goal_mu','assist_mu','expected_minutes']].head(8)
              print('DEEP_ALLOCATION',json.dumps(dict(gw=int(r.target_gw),team_goal_lambda=round(team_lambda,4),goal_mu_sum=round(float(team.goal_mu.sum()),4),assist_mu_sum=round(float(team.assist_mu.sum()),4),lefee_goal_share=round(float(r.goal_mu/team_lambda),4),lefee_assist_share=round(float(r.assist_mu/team.assist_mu.sum()),4),top_players=leaders.to_dict(orient='records'))))
          for name in ['player_fixture_observations.csv.gz','observed_team_xg_history.csv.gz']:
              q=pd.read_csv(b/name,low_memory=False)
              print('DEEP_SOURCE_COLUMNS',name,list(q.columns))
              if 'player_uuid' in q:
                  h=q[q.player_uuid.astype(str)==str(p.player_uuid.iloc[0])]
                  cols=[x for x in ['season','gw','minutes','xg','xa','goals','assists','kickoff_at','available_at','fixture_uuid','player_uuid'] if x in h]
                  print('DEEP_HIST',h[cols].to_json(orient='records',date_format='iso'))
                  print('DEEP_HIST_SUM',json.dumps(dict(rows=len(h),minutes=float(h.minutes.sum()),xg=float(h.xg.sum()),xa=float(h.xa.sum()))))
              elif 'team_id' in q:
                  h=q[q.team_id.eq(20)]
                  print('DEEP_TEAM',h.head(8).to_json(orient='records',date_format='iso'))
          PY
      - name: Walk-forward finishing calibration test (read-only)
        run: python scripts/audit_finishing_walkforward.py
      - name: Historical 2025-26 finishing development and untouched holdout (read-only)
        run: python scripts/audit_finishing_2025_26_holdout.py
      - name: A/B compare six-GW xP after tau-50 finishing (read-only)
        run: python scripts/locked_numerical_runtime.py scripts/audit_finishing_player_xp_impact.py
      - name: Compare Sunderland simple xG xGA baseline with frozen PM (read-only)
        run: python scripts/audit_sunderland_simple_attack_defence.py
      - name: Audit Le Fée six-GW forecast inputs (read-only)
        run: |
          python - <<'PY'
          import json,unicodedata,statistics
          from pathlib import Path
          p=Path('app/vfinal-diagnostic.json')
          d=json.loads(p.read_text())
          print('AUDIT_CUTOFF',d.get('data_asof'),'MODEL',d.get('model'),'PLAYER_COUNT',len(d.get('players',[])))
          def normalized(n):
              return ''.join(ch for ch in unicodedata.normalize('NFKD',str(n)) if not unicodedata.combining(ch)).casefold()
          terms=['fee','palmer','rogers','joao pedro','odegaard','saka','gross','brobbey','mbeumo','slater']
          matches=[x for x in d['players'] if any(t in normalized(x.get('name','')) for t in terms)]
          for x in matches:
              print('AUDIT_PLAYER',json.dumps({k:v for k,v in x.items() if k!='weeks'},ensure_ascii=False))
              for w in x.get('weeks',[]):
                  print('AUDIT_WEEK',x.get('name'),json.dumps(w,ensure_ascii=False))
          mid=[x for x in d['players'] if x.get('position')==3 and len(x.get('weeks',[]))>=6]
          rankings=sorted(((sum(w.get('xpts',0) for w in x['weeks'][:6]),x.get('name'),x.get('team')) for x in mid),reverse=True)
          print('AUDIT_TOP_MIDFIELDERS',json.dumps(rankings[:25],ensure_ascii=False))
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Record verified publication identity
        id: publication
        run: python scripts/verify_pages_publication.py --record
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    concurrency:
      group: fpl-pages-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-github-static-20261010
      - name: Refuse an older forecast after waiting for publication
        env:
          PAGES_SNAPSHOT: ${{ needs.build-and-deploy.outputs.snapshot }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_pages_publication.py
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

