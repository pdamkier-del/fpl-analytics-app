name: Free FPL webapp on GitHub Pages
on:
  push:
    branches: [free-github-static-20261010]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fpl-free-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify permanent current-season source checkpoint
        run: python scripts/restore_live_input_checkpoint.py --out work/restored-live-inputs
      - name: Generate honest static bridge preview
        run: python scripts/build_static_preview.py
      - name: Fetch recent official FPL fixtures
        run: python scripts/fetch_live_fixtures.py
      - name: Fetch verified completed GW player history for frozen MM feature preparation
        run: python scripts/fetch_current_gw_history.py
      - name: Calculate independent experimental 6GW xP (not locked PM)
        run: python scripts/build_own_forecast.py
      - name: Prepare verified official GW player-fixture source features
        run: python scripts/build_live_feature_base.py
      - name: Derive recent minutes and starts for official upcoming GW
        run: python scripts/build_gw_recency_features.py
      - name: Audit frozen final model for one actual upcoming gameweek
        run: python scripts/audit_live_one_gw.py
      - name: Publish locked final-model release contract
        run: python scripts/publish_final_model.py
      - name: Build verified position and availability layer
        run: python scripts/build_current_role_status.py
      - name: Apply frozen historical role model to stable current player IDs
        run: python scripts/build_static_role_snapshot.py
      - name: Install locked MM diagnostic requirements (no final-model promotion)
        run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - name: Keep locked model unavailable until separately certified
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("app/final-forecast.json")
          x=json.loads(p.read_text())
          if x.get("locked_model_active"):
              raise ValueError("Do not publish uncertified model in desktop release")
          print("Desktop deploy independent of MM replay reconstruction")
          PY
      - name: Verify official data and app entrypoints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=Path("app")
          files=["locked-forecast.html","overview.html","my-team.html","team-optimizer.html","fixtures-live.html","current-players.html","forecast-center.html","live-model-status.html","forecast-history.html","forecast-live.html","my-team-live.html","own-forecast.html","clubs-live.html","mm-diagnostic.html"]
          for f in files: assert (a/f).stat().st_size>1000,f
          fixtures=json.loads((a/"live-fixtures.json").read_text())
          people=json.loads((a/"current-players.json").read_text())
          assert len(fixtures["fixtures"])>=200
          assert len(people["players"])>=300
          assert len(people["teams"])==20, 'Expected 20 current Premier League clubs'
          assert all("ep_next" in p for p in people["players"])
          own=json.loads((a/"own-forecast.json").read_text())
          assert own["model"]=="experimental_owned_xp_v0" and own["locked_model_active"] is False
          assert own["data_asof"]==people["fetched_at"]
          assert len(own["players"])>=250
          final=json.loads((a/"final-forecast.json").read_text())
          assert final["model_version"]=="fpl-model-2026-10-09-assembled"
          assert final["data_asof"]==people["fetched_at"]
          audit=json.loads((a/"one-gw-readiness.json").read_text())
          assert audit["source_asof"]==people["fetched_at"] and audit["gw"]==people["next_gw"]
          assert audit["official_fixture_feature_base_ready"]
          source=json.loads((a/"gw-source-features.json").read_text())
          assert source["fixture_count"]==audit["fixture_count"]
          recency=json.loads((a/"gw-recency-features.json").read_text())
          assert recency["observed_at"]==people["fetched_at"] and recency["gw"]==people["next_gw"]
          assert recency["count"]==source["player_fixture_count"]
          assert recency["locked_mm_feature_complete"] is False
          history=json.loads((a/"historical-gw-stats.json").read_text())
          assert history["observed_at"]==people["fetched_at"]
          assert all(gw<people["next_gw"] for gw in history["completed_gws"])
          assert len(history["rows"])>=250*len(history["completed_gws"])
          assert source["certification"]["frozen_MM_feature_complete"] is False
          assert final["locked_model_active"] is False or (len(final["players"])>=250 and all(v=="verified" for v in final["parts"].values()))
          assert any(w["xpts"]>0 for p in own["players"] for w in p["weeks"])
          assert fixtures["fetched_at"]==people["fetched_at"]
          assert fixtures["next_gw"]==people["next_gw"]
          from datetime import datetime,timezone
          observed=datetime.fromisoformat(people["fetched_at"])
          assert 0 <= (datetime.now(timezone.utc)-observed).total_seconds()<600, "Live data older than 10 minutes"
          assert any(m["finished"] for m in fixtures["fixtures"])
          assert any(not m["finished"] for m in fixtures["fixtures"])
          print("VERIFIED CURRENT FPL:", "next GW",people["next_gw"],"games",len(fixtures["fixtures"]),"players",len(people["players"]),"fetched_at",people["fetched_at"])
          PY
      - name: Syntax-check frontend scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          for file in ['locked-forecast.html','forecast-history.html','forecast-live.html','own-forecast.html','forecast-center.html','current-players.html','fixtures-live.html','my-team.html','my-team-live.html','team-optimizer.html','clubs-live.html','mm-diagnostic.html']:
              s=(Path('app')/file).read_text()
              scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
              for i,script in enumerate(scripts):
                  if not script.strip(): continue
                  with tempfile.NamedTemporaryFile(suffix='.js',mode='w',encoding='utf8') as t:
                      t.write(script);t.flush()
                      subprocess.run(['node','--check',t.name],check=True)
              print('JS syntax OK:',file)
          PY
      - name: Verify redesigned pages and shared navigation
        run: |
          node --check app/design-v2.js
          python - <<'PY'
          from pathlib import Path
          css=Path('app/design-v2.css').read_text()
          js=Path('app/design-v2.js').read_text()
          assert '.fpl-bottom-nav' in css and '.fpl-appbar' in css
          assert 'aria-current' in js and 'fpl-appbar-search' in js
          assert "href:'clubs-live.html'" in js
          pages=[
            'overview.html','my-team-live.html','own-forecast.html',
            'forecast-live.html','team-optimizer.html','fixtures-live.html',
            'current-players.html','forecast-history.html','mobile.html',
            'live-model-status.html','forecast-center.html','models.html',
            'rankings.html','replay.html','index.html','my-team.html','clubs-live.html','mm-diagnostic.html'
          ]
          for page in pages:
              s=(Path('app')/page).read_text(encoding='utf-8')
              assert s.count('design-v2.css?v=2')==1,page
              assert s.count('design-v2.js?v=2')==1,page
              assert s.index('design-v2.css?v=2')<s.index('</head>'),page
              assert s.index('design-v2.js?v=2')<s.index('</body>'),page
          print('DESIGN VERIFIED:',len(pages),'responsive app pages')
          PY
      - name: Verify hard availability presentation by GW
        run: |
          node --check app/availability-ui.js
          node scripts/test_availability_ui.cjs
      - name: Test real FPL squad and formation rules
        run: node scripts/test_live_squad_rules.cjs
      - name: Mark GitHub Pages static directory
        run: touch app/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - uses: actions/deploy-pages@v4
