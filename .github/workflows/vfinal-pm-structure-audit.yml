name: vFinal PM structural audit

on:
  push:
    branches:
      - audit-role-minutes-20261001
    paths:
      - scripts/audit_vfinal_pm_structure.py
      - .github/workflows/vfinal-pm-structure-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
      - name: Audit PM structure
        run: |
          rm -rf analysis/results/vfinal-pm-structure-audit-20261006-v1
          PYTHONPATH=src python scripts/audit_vfinal_pm_structure.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Copilot@users.noreply.github.com"
          git add -f analysis/results/vfinal-pm-structure-audit-20261006-v1
          git commit -m "results: vFinal PM structural audit" || exit 0
          git push origin HEAD:audit-role-minutes-20261001
