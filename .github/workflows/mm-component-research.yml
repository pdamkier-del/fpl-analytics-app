name: Isolated MM component research
on:
  push:
    branches: [model-audit-optimization-20261012]
    paths:
      - scripts/audit_mm_*.py
      - scripts/build_mm_survival_distributions.py
      - scripts/experiment_mm_score_hazard.py
      - scripts/experiment_mm_walkforward.py
      - scripts/experiment_mm_pm.py
      - scripts/capture_mm_pm_inputs.py
      - src/fpl_v1_1_model/experimental_mm_research.py
      - src/fpl_v1_1_model/experimental_survival_sampler.py
      - tests/test_mm_component_audit.py
      - tests/test_mm_score_hazard.py
      - tests/test_experimental_survival_sampler.py
      - tests/test_experimental_mm_research.py
      - .github/workflows/mm-component-research.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: src:scripts
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_CORETYPE: NEHALEM
jobs:
  minutes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - run: |
          python -m pytest tests -q
          python scripts/current_diagnostic_checkpoint.py restore
          python scripts/restore_core_checkpoint.py
          python scripts/restore_2024_25_data_checkpoint.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '37612845586'
          name: final-locked-chain-gw1-38
          path: analysis/results/full-model-audit-20261012/locked-2125
      - run: |
          python scripts/locked_numerical_runtime.py scripts/run_2024_25_conditional_mm.py --db work/core.sqlite3 --derived data_v1_1/derived/season_2024_25_v1 --out analysis/results/conditional-2024-25-mm
          python scripts/locked_numerical_runtime.py scripts/audit_mm_components.py
          python scripts/locked_numerical_runtime.py scripts/experiment_mm_walkforward.py
          python scripts/locked_numerical_runtime.py scripts/audit_mm_live_trace.py
          python scripts/build_mm_survival_distributions.py
          python scripts/experiment_mm_score_hazard.py --prepare-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mm-component-inputs-and-results
          retention-days: 90
          path: |
            analysis/results/mm-research-20261014/*.json
            analysis/results/mm-research-20261014/*features.csv.gz
            analysis/results/mm-research-20261014/*candidates.csv.gz
            analysis/results/mm-research-20261014/*starter_hazards.jsonl.gz
            analysis/results/conditional-2024-25-mm
            analysis/results/full-model-audit-20261012/locked-2125
  point-model:
    needs: minutes
    strategy:
      fail-fast: false
      matrix:
        season: ['2024-25','2025-26']
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt requests
      - uses: actions/download-artifact@v4
        with:
          name: mm-component-inputs-and-results
          path: analysis/results
      - run: |
          python scripts/restore_core_checkpoint.py
          python scripts/restore_2024_25_data_checkpoint.py
      - if: matrix.season == '2025-26'
        uses: actions/checkout@v4
        with:
          ref: 952b809ad78eb08f2130c0aec683f30e6fa2e686
          path: work/benchmark-source
      - if: matrix.season == '2025-26'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '38375971604'
          name: correctness-ab-2025-26
          path: work/prior-pm
      - if: matrix.season == '2025-26'
        run: python scripts/restore_core_checkpoint.py --out work/benchmark-source/work/core.sqlite3
      - if: matrix.season == '2025-26'
        working-directory: work/benchmark-source
        run: |
          python scripts/reproduce_pstart_v2_fixture_minutes.py --db work/core.sqlite3 --out analysis/results/v2-reproduced-final-gw1 --min-gw 1
          python scripts/build_reproducible_role_benchmark.py --db work/core.sqlite3 --baseline analysis/results/v2-reproduced-final-gw1/pstart_v2_fixture_holdout_2025_26.csv --cutoffs analysis/results/workload-recovered-v4/authoritative_deadlines.csv --out analysis/results/reproducible-role-final-gw1
          python scripts/build_workload_features.py --db work/core.sqlite3 --features analysis/results/reproducible-role-final-gw1/all_feature_predictions.csv.gz --out analysis/results/workload-final-gw1
          cp analysis/results/reproducible-role-final-gw1/all_feature_predictions.csv.gz analysis/results/reproducible-role-v1/all_feature_predictions.csv.gz
          cp analysis/results/workload-final-gw1/all_features.csv.gz analysis/results/workload-recovered-v4/all_features.csv.gz
          cp analysis/results/workload-final-gw1/official_player_minutes.csv analysis/results/workload-recovered-v4/official_player_minutes.csv
          cp analysis/results/workload-final-gw1/team_match_coverage.csv analysis/results/workload-recovered-v4/team_match_coverage.csv
      - name: Rebuild full original PM components on each candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,subprocess,sys
          season='${{ matrix.season }}'
          cmd=[sys.executable,'scripts/locked_numerical_runtime.py','scripts/capture_mm_pm_inputs.py','--season',season,'--source-root','.' if season=='2024-25' else 'work/benchmark-source','--candidates',f'analysis/results/mm-research-20261014/{season}_candidates.csv.gz','--selection','analysis/results/mm-research-20261014/selection.json','--out',f'work/mm-pm-{season}']
          if season=='2025-26':
              paths=list(Path('work/prior-pm').rglob('inputs.jsonl.gz'))
              assert len(paths)==1,paths
              cmd+=['--archive','analysis/results/full-model-audit-20261012/locked-2125','--baseline-inputs',str(paths[0])]
          subprocess.run(cmd,check=True)
          PY
          python scripts/locked_numerical_runtime.py scripts/experiment_mm_pm.py --inputs work/mm-pm-${{ matrix.season }}/inputs.jsonl.gz --season ${{ matrix.season }} --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mm-original-pm-${{ matrix.season }}
          retention-days: 90
          path: |
            analysis/results/mm-research-20261014/*pm_report.json
            analysis/results/mm-research-20261014/*pm_predictions.csv.gz
            work/mm-pm-*/inputs.jsonl.gz
  score-context:
    needs: [minutes, point-model]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt requests
      - uses: actions/download-artifact@v4
        with:
          name: mm-component-inputs-and-results
          path: analysis/results
      - uses: actions/download-artifact@v4
        with:
          pattern: mm-original-pm-*
          merge-multiple: true
          path: work/context-inputs
      - run: |
          python scripts/restore_core_checkpoint.py
          python scripts/restore_2024_25_data_checkpoint.py
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys
          root=Path('work/context-inputs')
          paths={season:list(root.rglob(f'mm-pm-{season}/inputs.jsonl.gz')) for season in ['2024-25','2025-26']}
          assert all(len(p)==1 for p in paths.values()),paths
          subprocess.run([sys.executable,'scripts/experiment_mm_score_hazard.py','--inputs2024',str(paths['2024-25'][0]),'--inputs2025',str(paths['2025-26'][0])],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mm-score-context-results
          retention-days: 90
          path: analysis/results/mm-research-20261014/*score_hazard*.json
