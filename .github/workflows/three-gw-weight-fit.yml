name: 3GW weight fit

on:
  push:
    branches:
      - audit-role-minutes-20261001
    paths:
      - scripts/run_three_gw_weight_fit.py
      - .github/workflows/three-gw-weight-fit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
      - name: Run fit
        run: python scripts/run_three_gw_weight_fit.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/results/three-gw-weight-fit-20261005-v1
          git commit -m "results: fit 3GW transfer decay weights" || exit 0
          git push origin HEAD:audit-role-minutes-20261001
