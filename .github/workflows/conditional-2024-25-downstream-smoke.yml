name: Conditional 2024-25 downstream smoke

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - '.github/workflows/conditional-2024-25-downstream-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas==2.2.3 numpy==2.3.5 scipy scikit-learn requests
      - name: Restore core and historical data
        run: |
          mkdir -p work
          cat model/checkpoints/phase5e_core/parts/core.gz.part-* | gzip -dc > work/core.sqlite3
          python scripts/restore_2024_25_data_checkpoint.py
      - name: Download successful MM artifact for integration-only smoke
        uses: actions/download-artifact@v4
        with:
          name: conditional-2024-25-mm
          path: analysis/results/conditional-2024-25-mm
          github-token: ${{ github.token }}
          run-id: 37631444041
      - name: PM one-fixture smoke
        run: |
          rm -rf analysis/results/conditional-2024-25-pm-downstream-smoke
          PYTHONPATH=src python scripts/run_2024_25_conditional_pm.py \
            --db work/core.sqlite3 \
            --derived data_v1_1/derived/season_2024_25_v1 \
            --source analysis/results/conditional-2024-25-mm/conditional_feature_frame.csv.gz \
            --mm analysis/results/conditional-2024-25-mm/locked_mm_predictions.csv.gz \
            --out analysis/results/conditional-2024-25-pm-downstream-smoke \
            --start-origin 6 --end-origin 6 --max-fixtures 1
      - name: TS one-GW smoke
        run: |
          rm -rf analysis/results/conditional-2024-25-ts-downstream-smoke
          PYTHONPATH=src python scripts/run_2024_25_conditional_ts_gw6_38.py \
            --derived data_v1_1/derived/season_2024_25_v1 \
            --vfinal analysis/results/conditional-2024-25-pm-downstream-smoke/rolling_vfinal_forecast.csv.gz \
            --out analysis/results/conditional-2024-25-ts-downstream-smoke \
            --start-gw 6 --end-gw 6
