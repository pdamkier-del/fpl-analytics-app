name: PM with locked MM A-B

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_pm_locked_mm_ab.py'
      - '.github/workflows/pm-locked-mm-ab.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas numpy scikit-learn scipy requests
      - run: PYTHONPATH=src python scripts/run_pm_locked_mm_ab.py
      - uses: actions/upload-artifact@v4
        with:
          name: pm-locked-mm-ab-20261007-v1
          path: analysis/results/pm-locked-mm-ab-20261007-v1
          retention-days: 90
