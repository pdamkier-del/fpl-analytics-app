name: Probe 2026-27 tactical lineup evidence
on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths: ['.github/workflows/role-source-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source availability
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,traceback
          urls={
            'fotmob':'https://www.fotmob.com/api/matchDetails?matchId=5795363',
            'core_lineups':'https://raw.githubusercontent.com/olbauday/FPL-Core-Insights/main/data/2026-2027/By%20Tournament/Premier%20League/GW1/lineups.csv',
            'core_stats':'https://raw.githubusercontent.com/olbauday/FPL-Core-Insights/main/data/2026-2027/By%20Tournament/Premier%20League/GW1/playermatchstats.csv',
          }
          for key,url in urls.items():
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; FPL-role-data-verify/1.0)','Accept':'application/json'}),timeout=18) as f:
                s=f.read(900000); print('SOURCE',key,'status',f.status,'bytes',len(s),'type',f.headers.get('Content-Type'))
                if key=='fotmob':
                  j=json.loads(s)
                  print('FOTMOB_TOP',list(j.keys()))
                  c=j.get('content') or {};print('FOTMOB_CONTENT',list(c.keys()))
                  l=c.get('lineup') or {};print('FOTMOB_LINEUP_TYPE',type(l).__name__,'keys',list(l) if isinstance(l,dict) else '')
                  if isinstance(l,dict):
                    for k,v in l.items():
                      if isinstance(v,list):print('FOTMOB_ARRAY',k,'length',len(v),'sample',str(v[0])[:1300] if v else '')
                else:print('CORE_CSV_HEADER',s.splitlines()[0][:500])
            except Exception as e:print('SOURCE_ERROR',key,type(e).__name__,str(e)[:450])
          PY
