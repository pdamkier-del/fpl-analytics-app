name: Initial squad joint tests
on:
  push:
    branches: [audit-role-minutes-20261001]
    paths: ['src/fpl_xpts/initial_squad_joint.py','tests/test_initial_squad_joint.py','.github/workflows/initial-squad-joint-tests.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
      - run: PYTHONPATH=src pytest -q tests/test_initial_squad_joint.py
