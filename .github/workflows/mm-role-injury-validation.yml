name: MM-only role injury walk-forward and club validation
on:
  push:
    branches: [research-role-injury-club-audit-20261016]
    paths:
      - scripts/experimental_role_injury_mm.py
      - scripts/validate_role_injury_mm.py
      - scripts/verify_mm_archive_push_times.py
      - scripts/archive_role_injury_mm.py
      - tests/test_mm_role_injury_integration.py
      - .github/workflows/mm-role-injury-validation.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  PYTHONPATH: src:scripts:.
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  mm-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - name: MM, role, source and temporal regressions only
        run: python -m pytest tests/test_mm_role_injury_integration.py tests/test_research_role_injury_club_audit.py tests/test_team_news_history.py tests/test_team_news_audit.py -q
      - run: |
          git fetch origin 6d875a65251fb62f691dc0386ea81aeb29d27c0f
          python scripts/restore_role_mm_source.py
          python scripts/restore_core_checkpoint.py
          python scripts/restore_team_news_audit.py
      - name: Restore permanent verified source evidence (no expiring artifact dependency)
        run: |
          python scripts/archive_role_injury_mm.py --restore work/permanent-mm-evidence
          cp -r work/permanent-mm-evidence/news-2024 work/news-2024-push-verified
      - name: Historical MM only, fixed cohorts and no parameter tuning
        run: python scripts/validate_role_injury_mm.py
      - name: Verify locked production sources unchanged
        run: |
          git diff --exit-code 4f34321bb45b1aedf073aa0de6d29d9c7a35416f HEAD -- src/fpl_v1_1_model
          python scripts/archive_role_injury_mm.py
          python scripts/archive_role_injury_mm.py --restore work/verified-mm-capsule
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: role-injury-mm-complete
          path: |
            analysis/results/role-injury-mm-20261016/
            checkpoints/role_injury_mm_20261016/
      - name: Preserve public MM evidence on research branch
        run: |
          git config user.name 'FPL research evidence'
          git config user.email 'research-evidence@users.noreply.github.com'
          git fetch origin research-role-injury-club-audit-20261016
          if ! git diff --quiet "$GITHUB_SHA" origin/research-role-injury-club-audit-20261016 -- scripts/experimental_role_injury_mm.py scripts/validate_role_injury_mm.py scripts/verify_mm_archive_push_times.py; then
            echo 'Newer MM code exists; artifact preserved, refusing stale result publication.'
            exit 0
          fi
          git worktree add -b mm-evidence-publication /tmp/mm-evidence-publication origin/research-role-injury-club-audit-20261016
          mkdir -p /tmp/mm-evidence-publication/analysis/results/role-injury-mm-20261016 /tmp/mm-evidence-publication/checkpoints
          cp analysis/results/role-injury-mm-20261016/report.json analysis/results/role-injury-mm-20261016/summary.json analysis/results/role-injury-mm-20261016/coverage.csv analysis/results/role-injury-mm-20261016/source_manifest.json /tmp/mm-evidence-publication/analysis/results/role-injury-mm-20261016/
          cp -r checkpoints/role_injury_mm_20261016 /tmp/mm-evidence-publication/checkpoints/
          git -C /tmp/mm-evidence-publication add analysis/results/role-injury-mm-20261016 checkpoints/role_injury_mm_20261016
          git -C /tmp/mm-evidence-publication commit -m 'Preserve verified MM-only role injury data, club results and source clocks'
          git -C /tmp/mm-evidence-publication push origin HEAD:research-role-injury-club-audit-20261016
