name: FH raw xP gap test

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_fh_raw_gap_test.py'
      - 'scripts/run_fh_exact_gap_reference.py'
      - '.github/workflows/fh-raw-gap-test.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas==2.2.3 numpy==2.3.5 scipy scikit-learn requests
      - name: Restore 2024-25 historical data
        run: python scripts/restore_2024_25_data_checkpoint.py
      - name: Download 2024-25 conditional TS inputs
        uses: actions/download-artifact@v4
        with:
          name: conditional-2024-25-per-origin-full-gw6-38
          path: work/historical2425
          github-token: ${{ github.token }}
          run-id: 37639946603
      - name: Build exact 2024-25 raw FH-gap reference
        run: |
          VF24=$(find work/historical2425 -name rolling_vfinal_forecast.csv.gz | head -1)
          test -n "$VF24"
          rm -rf analysis/results/fh-exact-gap-reference
          PYTHONPATH=src:scripts python scripts/run_fh_exact_gap_reference.py             --derived data_v1_1/derived/season_2024_25_v1             --vfinal "$VF24"             --out analysis/results/fh-exact-gap-reference
      - name: Download locked 2125 chain
        uses: actions/download-artifact@v4
        with:
          name: final-locked-chain-gw1-38
          path: work/locked2125
          github-token: ${{ github.token }}
          run-id: 37612845586
      - name: Run 2025-26 raw FH xP-gap replay
        run: |
          VF=$(find work/locked2125 -name rolling_vfinal_forecast.csv.gz | head -1)
          REF=analysis/results/fh-exact-gap-reference/expected_best_remaining_reference.csv
          test -n "$VF"
          test -f "$REF"
          rm -rf analysis/results/fh-raw-gap-test
          PYTHONPATH=src:scripts python scripts/run_fh_raw_gap_test.py             --vfinal "$VF"             --reference "$REF"             --out analysis/results/fh-raw-gap-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fh-raw-gap-test
          path: |
            analysis/results/fh-exact-gap-reference
            analysis/results/fh-raw-gap-test
          retention-days: 90
