name: Experimental player finishing unit tests
on:
  push:
    branches: [research-player-finishing-20261016]
    paths:
      - 'src/fpl_v1_1_model/experimental_elite_finishing.py'
      - 'tests/test_experimental_elite_finishing.py'
      - '.github/workflows/experimental-player-finishing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finishing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scipy
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_experimental_elite_finishing.py -v
