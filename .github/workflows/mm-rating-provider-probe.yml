name: MM external rating provider probe
on:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - scripts/probe_mm_rating_providers.py
      - .github/workflows/mm-rating-provider-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_mm_rating_providers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mm-rating-provider-probe
          path: analysis/results/mm-rating-provider-probe-20261006-v1
          retention-days: 90
