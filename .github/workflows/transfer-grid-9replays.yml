name: 9-way transfer replay grid

on:
  push:
    branches:
      - audit-role-minutes-20261001
    paths:
      - scripts/run_transfer_grid_9replays.py
      - .github/workflows/transfer-grid-9replays.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
      - name: Run 9 replays
        run: python scripts/run_transfer_grid_9replays.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/results/transfer-grid-9replays-20261005-v1
          git commit -m "results: 9-way transfer replay grid" || exit 0
          git push origin HEAD:audit-role-minutes-20261001
