name: Isolated full model audit
on:
  push:
    branches: [model-audit-optimization-20261012]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - name: Regression tests and private snapshot invalidation
        run: |
          PYTHONPATH=src:scripts python -m pytest tests -q
          node tests/test_classic_manager.js
          node tests/test_player_profile_snapshot.js
          node tests/test_forecast_window.js
          node --check app/classic-manager.js
          node --check app/weekly-app.js
      - name: Restore checksummed sources without publishing
        run: |
          python scripts/current_diagnostic_checkpoint.py restore
          python scripts/restore_2024_25_data_checkpoint.py
          python scripts/restore_core_checkpoint.py --out work/core.sqlite3
      - name: Exact original reproduction and shadow minute experiment
        run: PYTHONPATH=src:scripts python scripts/locked_numerical_runtime.py scripts/audit_full_model_chain.py --simulate
      - name: Historical paired component replay and chronological finishing tests
        run: |
          PYTHONPATH=src:scripts python scripts/locked_numerical_runtime.py scripts/audit_historical_sampler.py
          python scripts/audit_finishing_cutoff_walkforward.py
          PYTHONPATH=src:scripts python scripts/audit_duration_walkforward.py
      - name: Shared duration through original PM and repeated-seed precision
        run: |
          PYTHONPATH=src:scripts python scripts/locked_numerical_runtime.py scripts/audit_duration_pm_shadow.py
          PYTHONPATH=src:scripts python scripts/locked_numerical_runtime.py scripts/audit_duration_pm_precision.py
      - name: Read authoritative benchmark artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '37612845586'
          name: final-locked-chain-gw1-38
          path: analysis/results/full-model-audit-20261012/locked-2125
      - name: Check preserved benchmark and true horizon coverage
        run: |
          PYTHONPATH=src python scripts/audit_locked_historical_horizon.py
          PYTHONPATH=src:scripts python scripts/audit_regular_starter_calibration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-model-audit-evidence
          path: |
            analysis/results/full-model-audit-20261012/*.json
            analysis/results/full-model-audit-20261012/*sampler*.csv.gz
            analysis/results/full-model-audit-20261012/live_*.csv.gz
            analysis/results/full-model-audit-20261012/duration_pm_*.csv.gz
            analysis/results/full-model-audit-20261012/duration_pm_precision.csv
            analysis/results/full-model-audit-20261012/team_finishing_source.csv
          retention-days: 90
