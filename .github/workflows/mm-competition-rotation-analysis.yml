name: MM observed competition rotation and importance source gates
on:
  push:
    branches: [research-role-injury-club-audit-20261016]
    paths:
      - scripts/analyze_mm_competition_rotation.py
      - tests/test_mm_competition_rotation.py
      - .github/workflows/mm-competition-rotation-analysis.yml
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONPATH: src:scripts:.
  OPENBLAS_NUM_THREADS: '1'
jobs:
  observed-mm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - name: MM and source regressions only
        run: python -m pytest tests/test_mm_competition_rotation.py tests/test_mm_all_clubs.py tests/test_mm_probability_robustness.py tests/test_mm_role_injury_integration.py tests/test_research_role_injury_club_audit.py tests/test_team_news_history.py tests/test_team_news_audit.py -q
      - name: Restore existing verified archives and unchanged frozen MM
        run: |
          python scripts/restore_core_checkpoint.py
          python scripts/restore_2024_25_data_checkpoint.py
          python scripts/archive_role_injury_mm.py --restore work/rotation-mm-source
          cp work/rotation-mm-source/results/predictions.npz analysis/results/role-injury-mm-20261016/
          sha256sum analysis/results/role-injury-mm-20261016/predictions.npz > work/rotation-baseline.sha256
      - name: Execute observed rotation, workload, controlled association and A reference replay
        run: python scripts/analyze_mm_competition_rotation.py
      - name: Production and frozen predictions unchanged
        run: |
          sha256sum --check work/rotation-baseline.sha256
          git diff --exit-code 4f34321bb45b1aedf073aa0de6d29d9c7a35416f HEAD -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mm-observed-competition-rotation
          path: analysis/results/mm-match-importance-20261016/
      - name: Save allowlisted public research results
        run: |
          git config user.name 'FPL MM research evidence'
          git config user.email 'research-evidence@users.noreply.github.com'
          git fetch origin research-role-injury-club-audit-20261016
          if ! git diff --quiet "$GITHUB_SHA" origin/research-role-injury-club-audit-20261016 -- scripts/analyze_mm_competition_rotation.py; then exit 0; fi
          git worktree add -b observed-mm-results /tmp/observed-mm-results origin/research-role-injury-club-audit-20261016
          mkdir -p /tmp/observed-mm-results/analysis/results/mm-match-importance-20261016
          for name in team_match_rotation.csv individual_recorded_workload.csv.gz club_competition_summary.csv pl_before_after_recorded_competitions.csv all_club_competition_coverage.csv controlled_turnover_association_predictions.csv controlled_turnover_association.json mm_ablation_availability_all40clubs.csv rotation_report.json rotation_manifest.json rotation_content_manifest.json; do
            cp "analysis/results/mm-match-importance-20261016/$name" "/tmp/observed-mm-results/analysis/results/mm-match-importance-20261016/$name"
          done
          git -C /tmp/observed-mm-results add analysis/results/mm-match-importance-20261016
          if git -C /tmp/observed-mm-results diff --cached --quiet; then exit 0; fi
          git -C /tmp/observed-mm-results commit -m 'Preserve observed competition rotation, workload and honest MM source gates'
          git -C /tmp/observed-mm-results push origin HEAD:research-role-injury-club-audit-20261016
