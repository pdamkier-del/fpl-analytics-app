name: Original TS v3 and chip assessment on explicit manager state
on:
  push:
    branches: [main]
    paths: [.github/workflows/live-manager-plan.yml]
  workflow_dispatch:
    inputs:
      manager_state_json:
        description: 'Validated manager-state JSON exported from the desktop page'
        required: true
        type: string
      forecast_cutoff:
        description: 'Optional expected forecast cutoff from the requesting browser'
        required: false
        type: string
      request_id:
        description: 'Browser request UUID for encrypted result delivery'
        required: true
        type: string
      public_key_json:
        description: 'Browser RSA public key; never a private key'
        required: true
        type: string
permissions:
  contents: write
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-github-static-20261010
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests cryptography==46.0.3
      - run: python scripts/current_diagnostic_checkpoint.py restore
      - run: python scripts/build_live_vfinal_desktop.py
      - run: python scripts/verify_official_forecast_window.py
      - name: Parse manager input as data, never shell code
        env:
          EXPECTED_FORECAST_CUTOFF: ${{ inputs.forecast_cutoff }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          expected=os.environ.get('EXPECTED_FORECAST_CUTOFF')
          forecast=json.loads(Path('app/vfinal-diagnostic.json').read_text())
          if expected and expected != forecast['data_asof']:
              raise ValueError('Forecast changed; reload app before requesting another plan')
          # GitHub prints step environment values in public run logs. Read
          # private state from the runner event file instead; never echo it.
          request=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          if not request.get('request_id') or not request.get('public_key_json'):
              raise ValueError('Encrypted browser delivery is required')
          raw=json.loads(request['manager_state_json'])
          Path('work/manager-state.json').write_text(json.dumps(raw))
          PY
      - name: Calculate original plan without logging personal input or output
        run: |
          if ! python scripts/locked_numerical_runtime.py scripts/run_live_locked_ts.py --state work/manager-state.json --out work/manager-plan.json --tc-samples work/live-manager-validation/tc_samples.csv.gz --tc-receipt work/live-manager-validation/tc_scenarios.json > work/manager-calculation.log 2>&1; then
            echo 'Personal calculation failed; private inputs and diagnostics were not published.'
            exit 1
          fi
      - run: python scripts/verify_official_forecast_window.py
      - name: Return encrypted result to requesting browser
        if: inputs.request_id != '' && inputs.public_key_json != ''
        env:
          MANAGER_REQUEST_ID: ${{ inputs.request_id }}
          MANAGER_PUBLIC_KEY: ${{ inputs.public_key_json }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_encrypted_manager_result.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-original-manager-plan-diagnostic
          path: work/encrypted-manager-plan.json
          retention-days: 30

  validate-online-runtime:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-github-static-20261010
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - run: python scripts/current_diagnostic_checkpoint.py restore
      - run: python scripts/build_live_vfinal_desktop.py
      - run: python scripts/verify_official_forecast_window.py
      - name: Validate original manager runtime on explicit synthetic state only
        run: python scripts/locked_numerical_runtime.py scripts/validate_live_manager_chain.py
      - run: PYTHONPATH=src python -m pytest -q tests/test_encrypted_manager_result.py tests/test_live_locked_ts_bridge.py tests/test_official_forecast_window.py
      - run: node --check app/manager-online.js
      - uses: actions/upload-artifact@v4
        with:
          name: original-manager-runtime-validation-not-personal
          path: app/integration-validation.json
          retention-days: 30
