name: Inspect live formation sources
on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths: ['.github/workflows/live-formation-source-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official and predicted lineup HTML for machine data
        run: |
          python - <<'PY'
          import re, urllib.request,json
          urls={
            'premierleague':'https://www.premierleague.com/en/clubs/8/chelsea',
            'pundit':'https://www.fantasyfootballpundit.com/fantasy-premier-league-team-news/',
            'pl_predictions':'https://www.premierleague.com/en/news/4720146',
          }
          for key,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
              with urllib.request.urlopen(req,timeout=16) as f:
                raw=f.read(1500000).decode('utf8','replace')
                print('FETCH',key,f.status,len(raw),'NextData','__NEXT_DATA__' in raw,'3-4-2-1',raw.find('3-4-2-1'),'Formation',raw.find('Formation'),'initialPayload',raw.find('self.__next_f.push'))
                for pattern in ('Chelsea predicted lineup:', 'Chelsea Predicted Lineup', 'Arsenal predicted lineup:', 'class="Formation-module', 'Starting 11', 'GW6 Bournemouth'):
                  i=raw.find(pattern)
                  if i>=0:print('SNIPPET',key,pattern,repr(raw[max(0,i-850):i+1100]))
            except Exception as e:print('FAIL',key,type(e).__name__,str(e)[:300])
          PY
