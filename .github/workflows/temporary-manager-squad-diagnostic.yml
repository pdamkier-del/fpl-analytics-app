name: Temporary public manager squad and B forecast diagnostic
on:
  push:
    branches: [research-manager-7647524-gw11-20261121]
    paths: [.github/workflows/temporary-manager-squad-diagnostic.yml]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 161b67b6fb8786a38e78c245b92a03ad841575d8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public FPL GW10 team and sealed B snapshot
        run: |
          python - <<'PY'
          import json,urllib.request
          API='https://fantasy.premierleague.com/api/'
          def load(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          profile=load(API+'entry/7647524/')
          boots=load(API+'bootstrap-static/')
          official={x['id']:x for x in boots['elements']}
          print('ENTRY',json.dumps({'name':profile.get('name'),'player_first_name':profile.get('player_first_name'),'event':profile.get('current_event'),'last_deadline_total_transfers':profile.get('last_deadline_total_transfers')}))
          for gw in [10,11]:
              try:
                  picks=load(API+f'entry/7647524/event/{gw}/picks/')
                  print('PICKS',gw,json.dumps({'active_chip':picks.get('active_chip'),'entry_history':picks.get('entry_history'),'players':[{'id':p['element'],'name':official.get(p['element'],{}).get('web_name'),'pos':p['position'],'captain':p['is_captain'],'purchase_price':p.get('purchase_price'),'selling_price':p.get('selling_price')} for p in picks['picks']]},ensure_ascii=False))
              except Exception as e:print('PICKS_UNAVAILABLE',gw,str(e)[:140])
          try:
              x=load(API+'entry/7647524/transfers/')
              print('TRANSFERS',json.dumps(x[-7:] if isinstance(x,list) else x,ensure_ascii=False)[:3500])
          except Exception as e:print('TRANSFERS_UNAVAILABLE',str(e)[:140])
          raw='https://raw.githubusercontent.com/pdamkier-del/fpl-analytics-app/free-github-static-20261010/app/mm-preview/current/'
          manifest=load(raw+'index.json')
          fc=load(raw+'forecast.json')
          print('B_MANIFEST',json.dumps({k:manifest[k] for k in ['gws','data_asof','forecast_sha256','model','origin_deadline']}))
          print('B_STRUCTURE',type(fc).__name__,list(fc)[:17] if isinstance(fc,dict) else len(fc))
          for key in ['players','forecasts','weeks','gws']:
              x=fc.get(key) if isinstance(fc,dict) else None
              if isinstance(x,list):print('B_FIELD',key,'length',len(x),'first',json.dumps(x[0],ensure_ascii=False)[:1900] if x else '')
          PY
      - name: Run unchanged full B MM PM TS v3 with WC for official FPL squad
        timeout-minutes: 8
        run: |
          python -m pip install -q -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests tabulate==0.10.0
          PYTHONPATH=src:scripts:. OPENBLAS_NUM_THREADS=1 python - <<'PY'
          import os,json,urllib.request,datetime
          from service.preview_manager_job import calculate
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}),timeout=45) as r:return json.load(r)
          base='https://raw.githubusercontent.com/pdamkier-del/fpl-analytics-app/free-github-static-20261010/app/mm-preview/current/'
          f=get(base+'forecast.json');index=get(base+'index.json')
          assert f['forecast_sha256']==index['forecast_sha256'] and f['gws'][0]==11
          picks=get('https://fantasy.premierleague.com/api/entry/7647524/event/10/picks/')
          player={p['id']:p for p in f['players']}
          squad=[dict(id=p['element'],purchase_price_tenths=player[p['element']]['price_tenths']) for p in picks['picks']]
          print('PRICE_ASSUMPTION: each purchase price approximated by forecast current price; bank £1.4m from official GW10; FT assumed 1; WC/FH/BB unused; TC GW5')
          for ft in [1,2]:
              state=dict(season=f['season'],gw=11,source='public_7647524_gw10_proxy_purchase_prices',observed_at=f['data_asof'],bank_tenths=14,free_transfers=ft,squad=squad,chips_used={'wildcard':[],'free_hit':[],'bench_boost':[],'triple_captain':[5]})
              try:
                  r=calculate(f,state,snapshot_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
                  assess=r.get('chip_assessment') or {}
                  cand=(assess.get('candidate_lineups') or {}).get('wildcard') or {}
                  normal=(r.get('plan') or {}).get('path') or []
                  follow=(r.get('wildcard_followup') or {})
                  def slim_path(path):
                      return [{'gw':a.get('gw'),'expected':a.get('projected_manager_score'),'hits':a.get('official_hit_points'),'in':[player[i]['name'] for i in a.get('incoming',[])],'out':[player[i]['name'] for i in a.get('outgoing',[])]} for a in path]
                  print('COMPACT_NORMAL',ft,json.dumps(slim_path(normal),ensure_ascii=False),flush=True)
                  print('COMPACT_WC',ft,json.dumps({'choice':assess.get('provisional_choice_without_missing_tc'),'q_wc':assess.get('q_wc'),'q_bb':assess.get('q_bb'),'wc_gain':assess.get('wc_gain'),'wc_gw11':cand.get('expected_score'),'wc_names':[player[i]['name'] for i in cand.get('squad_ids',[])],'wc_in':[player[i]['name'] for i in cand.get('incoming',[])],'wc_out':[player[i]['name'] for i in cand.get('outgoing',[])],'wc_followup':slim_path(follow.get('path') or []),'wc_6gw_total':follow.get('wc_without_bb_six_gw_xp_after_hits'),'wc_bb_6gw_total':follow.get('six_gw_xp_after_hits'),'wc_weighted':follow.get('wc_without_bb_weighted_objective'),'wc_bb_weighted':follow.get('weighted_objective_before_chip_timing_threshold'),'normal_weighted':r.get('plan',{}).get('objective')},ensure_ascii=False),flush=True)
                  print('FULL_TS',ft,json.dumps({'gw':r.get('gw'),'comparison':r.get('comparison'),'normal_path_first':(r.get('plan') or {}).get('path',[None])[0],'chip_assessment':{k:v for k,v in assess.items() if k!='candidate_lineups'},'wc_candidate':{'expected_score':cand.get('expected_score'),'squad_ids':cand.get('squad_ids'),'incoming':cand.get('incoming'),'outgoing':cand.get('outgoing'),'bank_after':cand.get('bank_after')},'wc_followup':{k:v for k,v in (r.get('wildcard_followup') or {}).items() if k!='path'}},ensure_ascii=False,default=str)[:10000],flush=True)
              except Exception as e:
                  print('FULL_TS_ERROR',ft,type(e).__name__,str(e)[:1100],flush=True)
          PY
      - name: Compare official 15-player GW10 squad to public B GW11-16 projections
        run: |
          python - <<'PY'
          import urllib.request,json
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=45) as r:return json.load(r)
          ids=[x['element'] for x in get('https://fantasy.premierleague.com/api/entry/7647524/event/10/picks/')['picks']]
          fc=get('https://raw.githubusercontent.com/pdamkier-del/fpl-analytics-app/free-github-static-20261010/app/mm-preview/current/forecast.json')
          weights=(1.,.6,.36,.216,.1296,.07776)
          def summary(p):
              w=p.get('weeks',[])
              xs=[float(next((v.get('xpts',0) for v in w if v.get('gw')==g),0)) for g in range(11,17)]
              return {'id':p['id'],'name':p['name'],'pos':p['position'],'team':p['team'],'price':p['price_tenths']/10,'gw11':round(xs[0],2),'xp6':round(sum(xs),2),'weighted':round(sum(a*b for a,b in zip(xs,weights)),2),'each':[round(x,2) for x in xs]}
          players=[summary(p) for p in fc['players']]
          by={p['id']:p for p in players}
          print('YOUR_15',json.dumps([by[i] for i in ids],ensure_ascii=False))
          for pos in range(1,5):
              opts=sorted((p for p in players if p['pos']==pos),key=lambda p:p['weighted'],reverse=True)[:14]
              print('TOP_'+str(pos),json.dumps(opts,ensure_ascii=False))
          print('EXPECTED_SELECTED_XP11',sum(by[i]['gw11'] for i in ids))
          PY
