name: Temporary public manager squad and B forecast diagnostic
on:
  push:
    branches: [research-manager-7647524-gw11-20261121]
    paths: [.github/workflows/temporary-manager-squad-diagnostic.yml]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read public FPL GW10 team and sealed B snapshot
        run: |
          python - <<'PY'
          import json,urllib.request
          API='https://fantasy.premierleague.com/api/'
          def load(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          profile=load(API+'entry/7647524/')
          boots=load(API+'bootstrap-static/')
          official={x['id']:x for x in boots['elements']}
          print('ENTRY',json.dumps({'name':profile.get('name'),'player_first_name':profile.get('player_first_name'),'event':profile.get('current_event'),'last_deadline_total_transfers':profile.get('last_deadline_total_transfers')}))
          for gw in [10,11]:
              try:
                  picks=load(API+f'entry/7647524/event/{gw}/picks/')
                  print('PICKS',gw,json.dumps({'active_chip':picks.get('active_chip'),'entry_history':picks.get('entry_history'),'players':[{'id':p['element'],'name':official.get(p['element'],{}).get('web_name'),'pos':p['position'],'captain':p['is_captain'],'purchase_price':p.get('purchase_price'),'selling_price':p.get('selling_price')} for p in picks['picks']]},ensure_ascii=False))
              except Exception as e:print('PICKS_UNAVAILABLE',gw,str(e)[:140])
          try:
              x=load(API+'entry/7647524/transfers/')
              print('TRANSFERS',json.dumps(x[-7:] if isinstance(x,list) else x,ensure_ascii=False)[:3500])
          except Exception as e:print('TRANSFERS_UNAVAILABLE',str(e)[:140])
          raw='https://raw.githubusercontent.com/pdamkier-del/fpl-analytics-app/free-github-static-20261010/app/mm-preview/current/'
          manifest=load(raw+'index.json')
          fc=load(raw+'forecast.json')
          print('B_MANIFEST',json.dumps({k:manifest[k] for k in ['gws','data_asof','forecast_sha256','model','origin_deadline']}))
          print('B_STRUCTURE',type(fc).__name__,list(fc)[:17] if isinstance(fc,dict) else len(fc))
          for key in ['players','forecasts','weeks','gws']:
              x=fc.get(key) if isinstance(fc,dict) else None
              if isinstance(x,list):print('B_FIELD',key,'length',len(x),'first',json.dumps(x[0],ensure_ascii=False)[:1900] if x else '')
          PY
