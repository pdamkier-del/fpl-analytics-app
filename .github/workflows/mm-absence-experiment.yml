name: MM injury and return-state experiment
on:
  push:
    branches: [free-github-static-20261010]
    paths:
      - scripts/experiment_mm_absence_states.py
      - scripts/experiment_mm_live_medical_return.py
      - scripts/audit_mm_verified_bench_evidence.py
      - .github/workflows/mm-absence-experiment.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  predeadline-history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies for frozen MM comparison
        run: pip install -r requirements-model-checkpoint.txt requests
      - name: Classify cutoff-safe injury, doubt and unexplained absence, then score candidate
        run: python scripts/experiment_mm_absence_states.py
      - name: Audit actual confirmed unused substitutes from the previous GW
        run: python scripts/audit_mm_verified_bench_evidence.py
      - name: Restore exact currently published original MM forecast inputs
        run: python scripts/current_diagnostic_checkpoint.py restore
      - name: Compare original and medical-return-adjusted current GW7 xM
        run: python scripts/experiment_mm_live_medical_return.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mm-return-injury-available-classification
          path: |
            work/live-final-model/mm_absence_states_and_return_calibration.json
            work/live-final-model/joao_pedro_medical_return_gw7_candidate.json
            work/live-final-model/mm_verified_bench_evidence.json
          retention-days: 30
