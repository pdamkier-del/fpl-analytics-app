name: Locked live vFinal integration checks
on:
  push:
    branches:
      - free-github-static-20261010
    paths:
      - scripts/assemble_live_vfinal_inputs.py
      - scripts/run_live_vfinal_joint_simulation.py
      - tests/test_assemble_live_vfinal_inputs.py
      - .github/workflows/live-vfinal-integrated-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt
      - run: PYTHONPATH=src:scripts python -m pytest -q tests/test_assemble_live_vfinal_inputs.py tests/test_run_live_vfinal_joint_simulation.py
      - name: Confirm no model promotion without verified artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('scripts/assemble_live_vfinal_inputs.py').read_text()
          assert "'locked_model_active':False" in source
          assert "'xp_generated':False" in source
          print('Full chain still requires real pre-cutoff current-year artifacts')
          PY
