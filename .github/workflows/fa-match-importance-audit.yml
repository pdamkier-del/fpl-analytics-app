name: FA Cup + Match Importance audit

on:
  push:
    branches:
      - audit-role-minutes-20261001
    paths:
      - scripts/run_fa_match_importance_rebuild.py
      - src/fpl_v1_1_model/match_importance.py
      - .github/workflows/fa-match-importance-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
          pip install requests
      - name: Run FA Cup and Match Importance rebuild
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p analysis/results/fa-match-importance-20261006-v1
          PYTHONPATH=src python scripts/run_fa_match_importance_rebuild.py 2>&1 | tee analysis/results/fa-match-importance-20261006-v1/run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit audit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/results/fa-match-importance-20261006-v1
          git commit -m "results: FA Cup workload and Match Importance audit trace" || exit 0
          git push origin HEAD:audit-role-minutes-20261001
      - name: Fail if rebuild failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
