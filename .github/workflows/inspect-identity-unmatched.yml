name: Inspect identity unmatched
on:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/inspect_identity_unmatched.py'
      - '.github/workflows/inspect-identity-unmatched.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt
      - run: PYTHONPATH=src python scripts/inspect_identity_unmatched.py
