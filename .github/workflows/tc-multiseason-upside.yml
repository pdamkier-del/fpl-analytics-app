name: TC multi-season upside comparison

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_tc_multiseason_upside.py'
      - '.github/workflows/tc-multiseason-upside.yml'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pandas numpy scipy scikit-learn
      - name: Restore 2024/25 actuals
        run: python scripts/restore_2024_25_data_checkpoint.py
      - name: Download 2024/25 TC origins
        uses: actions/download-artifact@v4
        with:
          pattern: tc24-origin-*
          path: work/tc24
          github-token: ${{ github.token }}
          run-id: 37660297901
      - name: Download 2025/26 TC origins
        uses: actions/download-artifact@v4
        with:
          pattern: tc-origin-*
          path: work/tc25
          github-token: ${{ github.token }}
          run-id: 37648731822
      - name: Run multi-season comparison
        run: |
          PYTHONPATH=src python scripts/run_tc_multiseason_upside.py \
            --origins24 work/tc24 \
            --origins25 work/tc25 \
            --actual24 data_v1_1/derived/season_2024_25_v1/player_fixture_actuals.csv.gz \
            --out analysis/results/tc-multiseason-upside \
            --discount 0.97
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tc-multiseason-upside
          path: analysis/results/tc-multiseason-upside
          retention-days: 90
