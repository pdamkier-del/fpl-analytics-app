name: TS v4 joint smoke

on:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_ts_v4_joint_smoke.py'
      - '.github/workflows/ts-v4-joint-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
      - name: Run GW1-only smoke
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: PYTHONPATH=src python scripts/run_ts_v4_joint_smoke.py
