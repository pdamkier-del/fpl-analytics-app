name: Probe FotMob FA Cup
on:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - scripts/probe_fotmob_fa.py
      - .github/workflows/probe-fotmob-fa.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit-role-minutes-20261001}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python scripts/probe_fotmob_fa.py
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Copilot@users.noreply.github.com"
          git add -f analysis/results/fotmob-fa-probe-20261006
          git commit -m "results: FotMob FA Cup probe" || exit 0
          git push origin HEAD:audit-role-minutes-20261001
