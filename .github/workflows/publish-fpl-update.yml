name: Publish FPL Update

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch/ref to publish from
        required: false
        default: audit-role-minutes-20261001
        type: string
      app_version:
        description: Optional explicit app version
        required: false
        type: string
      data_version:
        description: Optional explicit data version
        required: false
        type: string
      message:
        description: Release message
        required: false
        default: Published FPL model and website update
        type: string

permissions:
  contents: write

concurrency:
  group: publish-fpl-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'audit-role-minutes-20261001' }}
          fetch-depth: 0
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build update from source branch
        working-directory: source
        env:
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_DATA_VERSION: ${{ inputs.data_version }}
          INPUT_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${INPUT_APP_VERSION:-}" ]; then args+=(--app-version "$INPUT_APP_VERSION"); fi
          if [ -n "${INPUT_DATA_VERSION:-}" ]; then args+=(--data-version "$INPUT_DATA_VERSION"); fi
          message="${INPUT_MESSAGE:-Published FPL model and website update}"
          python scripts/publish_fpl_update.py "${args[@]}" --message "$message"

      - name: Verify source package
        working-directory: source
        run: |
          python - <<'PY'
          import gzip, json, hashlib
          from pathlib import Path

          m=json.loads(Path('updates/manifest.json').read_text(encoding='utf-8'))
          app=Path('updates')/Path(m['app']['url']).name
          data=Path('updates/data-base.json.gz')

          assert app.exists(), app
          assert data.exists(), data
          assert hashlib.sha256(app.read_bytes()).hexdigest()==m['app']['sha256']
          raw=gzip.decompress(data.read_bytes())
          assert hashlib.sha256(data.read_bytes()).hexdigest()==m['data']['sha256']
          assert hashlib.sha256(raw).hexdigest()==m['data']['uncompressed_sha256']
          payload=json.loads(raw)
          assert isinstance(payload,dict) and 'meta' in payload and 'forecasts' in payload
          print('update package verified')
          PY

      - name: Check out publish target
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: target

      - name: Copy built release to main
        run: |
          set -euo pipefail
          mkdir -p target/updates
          app_name="$(python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('source/updates/manifest.json').read_text())
          print(Path(m['app']['url']).name)
          PY
          )"
          cp "source/updates/$app_name" "target/updates/$app_name"
          cp source/updates/data-base.json.gz target/updates/data-base.json.gz
          cp source/updates/manifest.json target/updates/manifest.json
          cp source/VERSION.txt target/VERSION.txt
          cp source/DATA_VERSION.txt target/DATA_VERSION.txt

      - name: Commit published update to main
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/ VERSION.txt DATA_VERSION.txt
          if git diff --cached --quiet; then
            echo "No publish changes to commit."
            exit 0
          fi
          git commit -m "publish: FPL update $(cat VERSION.txt)"
          git pull --rebase origin main
          git push origin HEAD:main
