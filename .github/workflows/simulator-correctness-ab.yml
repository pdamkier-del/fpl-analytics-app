name: Opt-in simulator correctness A-B
on:
  workflow_dispatch:
  push:
    branches: [model-audit-optimization-20261012]
    paths:
      - src/fpl_v1_1_model/experimental_correctness_simulator.py
      - tests/test_experimental_correctness_simulator.py
      - scripts/audit_correctness_*.py
      - scripts/capture_correctness_inputs.py
      - .github/workflows/simulator-correctness-ab.yml
permissions:
  contents: read
  actions: read
jobs:
  live-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - run: |
          PYTHONPATH=src:scripts python -m pytest tests -q
          node tests/test_classic_manager.js
          node tests/test_player_profile_snapshot.js
          node tests/test_forecast_window.js
          python scripts/current_diagnostic_checkpoint.py restore
          PYTHONPATH=src:scripts python scripts/locked_numerical_runtime.py scripts/audit_correctness_live.py
          PYTHONPATH=src:scripts python scripts/locked_numerical_runtime.py scripts/audit_correctness_precision.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-correctness-ab
          path: analysis/results/full-model-audit-20261012/correctness_*
  historical:
    strategy:
      fail-fast: false
      matrix:
        season: ['2024-25','2025-26']
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: src:scripts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: NEHALEM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt requests
      - if: matrix.season == '2024-25'
        run: |
          python scripts/restore_core_checkpoint.py
          python scripts/restore_2024_25_data_checkpoint.py
          python scripts/locked_numerical_runtime.py scripts/run_2024_25_conditional_mm.py --db work/core.sqlite3 --derived data_v1_1/derived/season_2024_25_v1 --out analysis/results/conditional-2024-25-mm
          python scripts/locked_numerical_runtime.py scripts/capture_correctness_inputs.py --season 2024-25 --source-root . --out work/correctness-2024
          python scripts/locked_numerical_runtime.py scripts/audit_correctness_historical.py --inputs work/correctness-2024/inputs.jsonl.gz --season 2024-25 --db work/core.sqlite3 --out analysis/results/full-model-audit-20261012
      - if: matrix.season == '2025-26'
        uses: actions/checkout@v4
        with:
          ref: 952b809ad78eb08f2130c0aec683f30e6fa2e686
          path: work/benchmark-source
      - if: matrix.season == '2025-26'
        run: python scripts/restore_core_checkpoint.py --out work/benchmark-source/work/core.sqlite3
      - if: matrix.season == '2025-26'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '37612845586'
          name: final-locked-chain-gw1-38
          path: work/benchmark-artifact
      - name: Rebuild immutable benchmark warm inputs
        if: matrix.season == '2025-26'
        working-directory: work/benchmark-source
        run: |
          python scripts/reproduce_pstart_v2_fixture_minutes.py --db work/core.sqlite3 --out analysis/results/v2-reproduced-final-gw1 --min-gw 1
          python scripts/build_reproducible_role_benchmark.py --db work/core.sqlite3 --baseline analysis/results/v2-reproduced-final-gw1/pstart_v2_fixture_holdout_2025_26.csv --cutoffs analysis/results/workload-recovered-v4/authoritative_deadlines.csv --out analysis/results/reproducible-role-final-gw1
          python scripts/build_workload_features.py --db work/core.sqlite3 --features analysis/results/reproducible-role-final-gw1/all_feature_predictions.csv.gz --out analysis/results/workload-final-gw1
          cp analysis/results/reproducible-role-final-gw1/all_feature_predictions.csv.gz analysis/results/reproducible-role-v1/all_feature_predictions.csv.gz
          cp analysis/results/workload-final-gw1/all_features.csv.gz analysis/results/workload-recovered-v4/all_features.csv.gz
          cp analysis/results/workload-final-gw1/official_player_minutes.csv analysis/results/workload-recovered-v4/official_player_minutes.csv
          cp analysis/results/workload-final-gw1/team_match_coverage.csv analysis/results/workload-recovered-v4/team_match_coverage.csv
      - name: Historical simulator ablation (no production publishing)
        if: matrix.season == '2025-26'
        run: |
          python scripts/locked_numerical_runtime.py scripts/capture_correctness_inputs.py --season 2025-26 --source-root work/benchmark-source --archive work/benchmark-artifact --out work/correctness-2025
          python scripts/locked_numerical_runtime.py scripts/audit_correctness_historical.py --inputs work/correctness-2025/inputs.jsonl.gz --season 2025-26 --db work/benchmark-source/work/core.sqlite3 --out analysis/results/full-model-audit-20261012
      - name: Require unchanged historical TS accounting
        if: matrix.season == '2025-26'
        working-directory: work/benchmark-source
        run: |
          python scripts/run_ts_v3_final_chain_gw6.py --vfinal ../correctness-2025/captured_reference/rolling_vfinal_forecast.csv.gz --out analysis/results/correctness-original-ts
          python -c "import json; from pathlib import Path; s=json.loads(Path('analysis/results/correctness-original-ts/summary.json').read_text()); assert (s['total_points'],s['transfers'],s['hit_points'])==(2125,44,28),s"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-ab-${{ matrix.season }}
          path: |
            work/correctness-*/inputs.jsonl.gz
            work/correctness-*/captured_reference
            analysis/results/full-model-audit-20261012/correctness_*
            work/benchmark-source/analysis/results/correctness-original-ts
          retention-days: 90
