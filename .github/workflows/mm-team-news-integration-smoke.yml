name: MM Team News integration smoke

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'src/fpl_v1_1_model/team_news_history.py'
      - 'scripts/smoke_mm_team_news_integration.py'
      - '.github/workflows/mm-team-news-integration-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas numpy scipy scikit-learn requests
      - run: PYTHONPATH=src python scripts/smoke_mm_team_news_integration.py
