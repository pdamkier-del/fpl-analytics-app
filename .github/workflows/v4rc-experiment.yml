name: v4RC experiment

on:
  push:
    branches:
      - audit-role-minutes-20261001
    paths:
      - scripts/run_v4rc_experiment.py
      - .github/workflows/v4rc-experiment.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-v4rc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install model test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt

      - name: Run v4RC experiment
        run: |
          python scripts/run_v4rc_experiment.py

      - name: Commit immutable v4RC result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/results/v4rc-20261005-v1
          git commit -m "results: v4RC role-competition experiment" || exit 0
          git push origin HEAD:audit-role-minutes-20261001
