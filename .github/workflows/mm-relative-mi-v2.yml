name: MM relative MI v2 walk-forward

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'src/fpl_v1_1_model/relative_match_importance.py'
      - 'src/fpl_v1_1_model/relative_future_match_importance.py'
      - 'scripts/run_mm_relative_mi_v2_walkforward.py'
      - 'tests/test_relative_match_importance.py'
      - 'tests/test_relative_future_match_importance.py'
      - '.github/workflows/mm-relative-mi-v2.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas numpy scikit-learn pytest requests
      - run: PYTHONPATH=src pytest -q tests/test_relative_match_importance.py tests/test_relative_future_match_importance.py tests/test_future_match_importance.py
      - run: PYTHONPATH=src python scripts/run_mm_relative_mi_v2_walkforward.py
      - uses: actions/upload-artifact@v4
        with:
          name: mm-relative-mi-v2-20261006-v1
          path: analysis/results/mm-relative-mi-v2-20261006-v1
          retention-days: 90