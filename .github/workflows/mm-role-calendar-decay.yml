name: MM role chronology decay audit
on:
  push:
    branches: [free-github-static-20261010]
    paths:
      - scripts/audit_mm_role_history_calendar_decay.py
      - .github/workflows/mm-role-calendar-decay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-real-days:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing MM dependencies
        run: pip install -r requirements-model-checkpoint.txt requests scikit-learn
      - name: Test role hierarchy decay by actual elapsed days versus count of past games
        run: python scripts/audit_mm_role_history_calendar_decay.py
      - name: Save audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mm-role-calendar-time
          path: work/live-final-model/mm_role_calendar_vs_game_lag.json
          retention-days: 30
