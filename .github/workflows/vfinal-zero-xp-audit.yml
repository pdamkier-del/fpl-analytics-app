name: vFinal zero xP audit
on:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_vfinal_zero_xp_audit.py'
      - '.github/workflows/vfinal-zero-xp-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt
      - run: PYTHONPATH=src python scripts/run_vfinal_zero_xp_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vfinal-zero-xp-audit
          path: analysis/results/vfinal-zero-xp-audit-20261006-v1
