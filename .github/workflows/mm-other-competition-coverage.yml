name: MM other-competition coverage audit
on:
  push:
    branches: [research-role-injury-club-audit-20261016]
    paths:
      - 'scripts/audit_mm_all_competition_coverage.py'
      - '.github/workflows/mm-other-competition-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_mm_all_competition_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: mm-other-competition-source-inventory
          path: analysis/results/mm-match-importance-20261016/source-inventory.json
          if-no-files-found: error
