name: Inspect vFinal feature schema
on:
  push:
    branches: [audit-role-minutes-20261001]
    paths: ['scripts/inspect_vfinal_feature_schema.py','.github/workflows/inspect-vfinal-schema.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-model-checkpoint.txt
      - run: python scripts/inspect_vfinal_feature_schema.py
