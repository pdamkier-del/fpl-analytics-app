name: WC v2 regression tests
on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'tests/test_wildcard_v2.py'
      - '.github/workflows/wc-v2-regression.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas==2.2.3 numpy==2.3.5 scipy scikit-learn pytest
      - name: Run WC cutoff and pricing regression tests
        run: PYTHONPATH=src pytest -q tests/test_wildcard_v2.py
