name: Live MM frozen input readiness audit (no certification)
on:
  push:
    branches: [free-github-static-20261010]
    paths:
      - 'scripts/audit_live_inference_readiness.py'
      - 'scripts/audit_live_penalty_bps_sources.py'
      - 'scripts/audit_frozen_live_component_preflight.py'
      - 'scripts/build_live_penalty_fpl_team_ids.py'
      - 'tests/test_build_live_penalty_fpl_team_ids.py'
      - 'scripts/restore_frozen_live_assist_prior.py'
      - 'tests/test_restore_frozen_live_assist_prior.py'
      - 'tests/test_audit_frozen_live_component_preflight.py'
      - 'scripts/inspect_live_fotmob_penalty_bps.py'
      - 'scripts/extract_explicit_penalty_shots.py'
      - 'tests/test_extract_explicit_penalty_shots.py'
      - 'tests/test_inspect_live_penalty_shotmap.py'
      - 'scripts/join_live_vfinal_inputs.py'
      - 'scripts/run_live_vfinal_bps.py'
      - 'scripts/run_live_vfinal_penalty_state.py'
      - 'scripts/assemble_live_vfinal_inputs.py'
      - 'scripts/run_live_vfinal_joint_simulation.py'
      - 'tests/test_assemble_live_vfinal_inputs.py'
      - 'tests/test_run_live_vfinal_joint_simulation.py'
      - 'scripts/audit_completed_gw_history.py'
      - 'tests/test_audit_completed_gw_history.py'
      - 'scripts/build_locked_live_sequence_features.py'
      - 'scripts/build_locked_live_performance_features.py'
      - 'scripts/build_locked_live_v2_baseline.py'
      - 'scripts/live_provider_stat_evidence.py'
      - 'scripts/build_live_mm_training_features.py'
      - 'scripts/collect_archived_fpl_gw1_5.py'
      - 'src/fpl_v1_1_model/archived_current_season_cohorts.py'
      - 'scripts/run_locked_live_mm_inference.py'
      - 'scripts/audit_live_vfinal_sources.py'
      - 'scripts/build_live_pm_observed_team_xg.py'
      - 'scripts/run_live_vfinal_team_latent.py'
      - 'scripts/inspect_live_pm_team_shots.py'
      - 'scripts/run_live_vfinal_keeper_saves.py'
      - 'scripts/run_live_vfinal_player_components.py'
      - 'tests/test_live_provider_stat_evidence.py'
      - '.github/workflows/live-mm-feature-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - name: Test existing approved availability and exact provider conversion
        run: PYTHONPATH=src python -m pytest tests/test_live_provider_stat_evidence.py tests/test_live_availability_boundary.py tests/test_mm_live_release_export.py tests/test_final_publish_availability_gate.py -q
      - name: Test frozen vFinal live gap auditor
        run: python -m pytest -q tests/test_audit_frozen_live_component_preflight.py
      - name: Restore verified live source checkpoint
        run: python scripts/restore_live_input_checkpoint.py --out .
      - name: Test literal penalty-shot source evidence scanner
        run: python -m pytest -q tests/test_inspect_live_penalty_shotmap.py
      - name: Inspect archived 2026 FotMob penalty and BPS field evidence
        run: python scripts/inspect_live_fotmob_penalty_bps.py
      - name: Test literal historical penalty candidate extraction
        run: python -m pytest -q tests/test_extract_explicit_penalty_shots.py
      - name: Extract archived penalty shot candidate events without asserting completion
        run: python scripts/extract_explicit_penalty_shots.py
      - name: Assert GW1-5 observation coverage and pre-cutoff timestamps
        run: python scripts/audit_completed_gw_history.py
      - name: Test complete cutoff-safe GW history guard
        run: python -m pytest -q tests/test_audit_completed_gw_history.py tests/test_bridge_official_gw_to_replay.py
      - name: Recover actual predeadline player rosters and team news GW1-5
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_archived_fpl_gw1_5.py
      - name: Derive the exact frozen sequence features from completed FPL matches
        run: python scripts/build_locked_live_sequence_features.py
      - name: Derive exact frozen performance signals from cutoff-safe observed provider events
        run: python scripts/build_locked_live_performance_features.py
      - name: Reproduce stored frozen v2 baseline and Phase 3A conditional-minute priors
        run: python scripts/build_locked_live_v2_baseline.py
      - name: Audit exact frozen MM feature requirements for six upcoming GWs
        run: python scripts/audit_live_inference_readiness.py
      - name: Reconstruct cutoff-filtered GW1-5 covariates with explicit roster/news limitations
        run: python scripts/build_live_mm_training_features.py
      - name: Execute original locked MM on one GW, diagnostic quality only
        run: python scripts/run_locked_live_mm_inference.py --one-gw
      - name: Execute original locked MM on six GWs, diagnostic quality only
        run: python scripts/run_locked_live_mm_inference.py
      - name: Build observed team xG with full player source coverage for PM
        run: python scripts/build_live_pm_observed_team_xg.py
      - name: Run unchanged vFinal team goal strength inference for six-GW fixtures
        run: python scripts/run_live_vfinal_team_latent.py
      - name: Inspect actual provider team shots source for frozen keeper model
        run: python scripts/inspect_live_pm_team_shots.py
      - name: Run frozen keeper-save expected value model on archived team shot counts
        run: python scripts/run_live_vfinal_keeper_saves.py
      - name: Run original six-GW player event rates for attack assists cards and DefCon
        run: python scripts/run_live_vfinal_player_components.py
      - name: Audit frozen vFinal source coverage without inventing xP
        run: python scripts/audit_live_vfinal_sources.py
      - name: Verify live chain adapter contracts
        run: PYTHONPATH=src:scripts python -m pytest -q tests/test_join_live_vfinal_inputs.py tests/test_run_live_vfinal_penalty_state.py tests/test_run_live_vfinal_bps.py tests/test_assemble_live_vfinal_inputs.py tests/test_run_live_vfinal_joint_simulation.py
      - name: Join current six-GW MM and PM ingredients
        run: python scripts/join_live_vfinal_inputs.py
      - name: Test original historical assist prior restoration
        run: PYTHONPATH=src:scripts python -m pytest -q tests/test_restore_frozen_live_assist_prior.py
      - name: Restore original vFinal historic assist-per-goal prior
        run: python scripts/restore_frozen_live_assist_prior.py
      - name: Report all exact frozen vFinal source and feature gaps
        run: python scripts/audit_frozen_live_component_preflight.py
      - name: Test official current-season penalty team identities
        run: python -m pytest -q tests/test_build_live_penalty_fpl_team_ids.py
      - name: Verify official 2026 team IDs for frozen penalty input namespace
        run: python scripts/build_live_penalty_fpl_team_ids.py
      - name: Audit exact source coverage for frozen penalty and BPS adapters
        run: python scripts/audit_live_penalty_bps_sources.py
      - name: Apply original frozen penalty state
        run: |
          GW=$(python -c "import pandas as pd; p='data_v1_1/derived/live_locked_inputs/2026-27-v1/vfinal_live_joined_inputs.csv.gz'; x=pd.read_csv(p,usecols=['target_gw']); print(int(x.target_gw.min()))")
          python scripts/run_live_vfinal_penalty_state.py --origin "$GW" \
            --attempts data_v1_1/derived/live_locked_inputs/2026-27-v1/verified_penalty_attempts.csv.gz \
            --sides data_v1_1/derived/live_locked_inputs/2026-27-v1/verified_penalty_team_sides.csv.gz \
            --teams data_v1_1/derived/live_locked_inputs/2026-27-v1/verified_penalty_team_ids.csv.gz
      - name: Apply original frozen BPS regression
        run: python scripts/run_live_vfinal_bps.py --ledger data_v1_1/derived/live_locked_inputs/2026-27-v1/verified_bps_action_ledger.csv.gz
      - name: Assemble complete live simulator inputs
        run: python scripts/assemble_live_vfinal_inputs.py
      - name: Run original locked vFinal simulator for six upcoming GWs
        run: python scripts/run_live_vfinal_joint_simulation.py --input data_v1_1/derived/live_locked_inputs/2026-27-v1/vfinal_live_full_simulator_input.csv.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-mm-feature-readiness-evidence
          path: |
            work/live-final-model/provider_penalty_bps_evidence.json
            work/live-final-model/explicit_penalty_shot_evidence.json
            work/live-final-model/live_assist_prior_provenance.json
            work/live-final-model/frozen_vfinal_component_preflight.json
            work/live-final-model/live_penalty_bps_source_coverage.json
            work/live-final-model/live_vfinal_full_input_audit.json
            work/live-final-model/live_vfinal_simulation_audit.json
            work/live-final-model/current_season_history_gate.json
            work/live-final-model/live_inference_readiness.json
            work/live-final-model/live_performance_provenance.json
            work/live-final-model/live_baseline_provenance.json
            work/live-final-model/live_passing_evidence.json
            work/live-final-model/live_training_provenance.json
            work/live-final-model/live_vfinal_readiness.json
            work/live-final-model/predeadline_2026_archives/*.json
            work/live-final-model/live_team_xg_provenance.json
            work/live-final-model/live_vfinal_team_latent.json
            work/live-final-model/live_vfinal_keeper_saves.json
            work/live-final-model/live_vfinal_player_component_audit.json
            data_v1_1/derived/live_locked_inputs/2026-27-v1/live_vfinal_fixture_xp.csv.gz
            data_v1_1/derived/live_locked_inputs/2026-27-v1/vfinal_live_full_simulator_input.csv.gz
            data_v1_1/derived/live_locked_inputs/2026-27-v1/vfinal_player_event_components_6gw.csv.gz
            data_v1_1/derived/live_locked_inputs/2026-27-v1/keeper_lambda_saves_by_fixture_team.csv.gz
            data_v1_1/derived/live_locked_inputs/2026-27-v1/future_team_goal_lambdas.csv.gz
            data_v1_1/derived/live_locked_inputs/2026-27-v1/observed_team_xg_history.csv.gz
            work/live-final-model/mm_inference_*.json
            work/live-final-model/mm_frozen_diagnostic_*.csv.gz
            data_v1_1/derived/live_locked_inputs/2026-27-v1/reconstructed_training_features.csv.gz
          retention-days: 90

