name: TS v3 full-season replay

on:
  push:
    branches:
      - audit-role-minutes-20261001
    paths:
      - scripts/run_transfer_strategy_v3_replay.py
      - .github/workflows/transfer-strategy-v3-replay.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
      - name: Run TS v3 replay
        run: PYTHONPATH=src python scripts/run_transfer_strategy_v3_replay.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/results/transfer-strategy-v3-replay-20261005-v1
          git commit -m "results: TS v3 full-season replay" || exit 0
          git push origin HEAD:audit-role-minutes-20261001
