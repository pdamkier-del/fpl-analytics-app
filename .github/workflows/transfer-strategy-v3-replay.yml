name: TS v3 full-season replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
      - name: Run TS v3 replay
        run: PYTHONPATH=src python scripts/run_transfer_strategy_v3_replay.py
      - name: Preserve replay results and resumable checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-v3-replay
          path: analysis/results/transfer-strategy-v3-replay-20261005-v2
