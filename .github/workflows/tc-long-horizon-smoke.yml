name: TC long-horizon smoke

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_tc_long_horizon_origin.py'
      - '.github/workflows/tc-long-horizon-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas numpy scipy scikit-learn requests
      - name: Restore inputs
        run: |
          mkdir -p work
          cat model/checkpoints/phase5e_core/parts/core.gz.part-* | gzip -dc > work/core.sqlite3
          python scripts/restore_team_news_audit.py
          python scripts/validate_team_news_audit.py
      - name: Download authoritative locked-chain artifact
        uses: actions/download-artifact@v4
        with:
          name: final-locked-chain-gw1-38
          path: work/final-chain
          github-token: ${{ github.token }}
          run-id: 37612845586
      - name: Run TC origin smoke
        run: |
          PYTHONPATH=src python scripts/run_tc_long_horizon_origin.py \
            --db work/core.sqlite3 \
            --source analysis/results/fa-match-importance-20261006-v1/all_features_fa_mi.csv.gz \
            --mm work/final-chain/locked-mm-final-gw6-38/locked_mm_predictions.csv.gz \
            --out analysis/results/tc-origin-6 \
            --origin 6 --period-end 19 --draws 40 --top-k 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tc-long-horizon-smoke
          path: analysis/results/tc-origin-6
          retention-days: 30
