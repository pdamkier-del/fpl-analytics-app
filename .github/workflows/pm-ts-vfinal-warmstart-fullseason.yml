name: PM TS vFinal warmstart full season

on:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_pm_ts_vfinal_warmstart_fullseason.py'
      - '.github/workflows/pm-ts-vfinal-warmstart-fullseason.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
      - name: Tests
        run: PYTHONPATH=src pytest -q tests/test_initial_squad_joint.py tests/test_transfer_planner_joint.py tests/test_season_replay.py
      - name: Run full season PM plus TS
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: PYTHONPATH=src python scripts/run_pm_ts_vfinal_warmstart_fullseason.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pm-ts-vfinal-warmstart-fullseason
          path: analysis/results/pm-ts-vfinal-warmstart-fullseason-20261006-v1
          if-no-files-found: warn
