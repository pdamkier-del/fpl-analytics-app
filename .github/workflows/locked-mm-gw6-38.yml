name: Locked MM GW6-38 full rebuild

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_locked_mm_gw6_38.py'
      - '.github/workflows/locked-mm-gw6-38.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas numpy scipy scikit-learn requests
      - name: Restore core
        run: |
          mkdir -p work
          cat model/checkpoints/phase5e_core/parts/core.gz.part-* | gzip -dc > work/core.sqlite3
      - name: Restore Team News
        run: |
          python scripts/restore_team_news_audit.py
          python scripts/validate_team_news_audit.py
      - name: Rebuild GW1-38 baseline
        run: |
          rm -rf analysis/results/v2-reproduced-fullseason-gw1-v2
          PYTHONPATH=src python scripts/reproduce_pstart_v2_fixture_minutes.py             --db work/core.sqlite3             --out analysis/results/v2-reproduced-fullseason-gw1-v2             --min-gw 1
      - name: Rebuild GW1-38 role history/features
        run: |
          rm -rf analysis/results/reproducible-role-fullseason-gw1-v2
          PYTHONPATH=src python scripts/build_reproducible_role_benchmark.py             --db work/core.sqlite3             --baseline analysis/results/v2-reproduced-fullseason-gw1-v2/pstart_v2_fixture_holdout_2025_26.csv             --cutoffs analysis/results/workload-recovered-v4/authoritative_deadlines.csv             --out analysis/results/reproducible-role-fullseason-gw1-v2
      - name: Rebuild GW1-38 workload
        run: |
          rm -rf analysis/results/workload-fullseason-gw1-v2
          PYTHONPATH=src python scripts/build_workload_features.py             --db work/core.sqlite3             --features analysis/results/reproducible-role-fullseason-gw1-v2/all_feature_predictions.csv.gz             --out analysis/results/workload-fullseason-gw1-v2
      - name: Substitute extended feature universe in ephemeral runner
        run: |
          cp analysis/results/reproducible-role-fullseason-gw1-v2/all_feature_predictions.csv.gz analysis/results/reproducible-role-v1/all_feature_predictions.csv.gz
          cp analysis/results/workload-fullseason-gw1-v2/all_features.csv.gz analysis/results/workload-recovered-v4/all_features.csv.gz
          cp analysis/results/workload-fullseason-gw1-v2/official_player_minutes.csv analysis/results/workload-recovered-v4/official_player_minutes.csv
          cp analysis/results/workload-fullseason-gw1-v2/team_match_coverage.csv analysis/results/workload-recovered-v4/team_match_coverage.csv
      - name: Rebuild FA + Match Importance on extended universe
        run: |
          rm -rf analysis/results/fa-match-importance-20261006-v1
          PYTHONPATH=src python scripts/run_fa_match_importance_rebuild.py
      - name: Locked MM walk-forward GW6-38
        run: |
          rm -rf analysis/results/locked-mm-gw6-38-20261007-v1
          PYTHONPATH=src python scripts/run_locked_mm_gw6_38.py             --source analysis/results/fa-match-importance-20261006-v1/all_features_fa_mi.csv.gz             --out analysis/results/locked-mm-gw6-38-20261007-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locked-mm-gw6-38-20261007-v1
          path: |
            analysis/results/locked-mm-gw6-38-20261007-v1
            analysis/results/fa-match-importance-20261006-v1/all_features_fa_mi.csv.gz
            analysis/results/reproducible-role-fullseason-gw1-v2/all_feature_predictions.csv.gz
            analysis/results/reproducible-role-fullseason-gw1-v2/classified_starters.csv
            analysis/results/workload-fullseason-gw1-v2
          retention-days: 90
