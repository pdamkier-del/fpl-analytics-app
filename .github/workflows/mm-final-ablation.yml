name: MM final ablation

on:
  push:
    branches:
      - audit-role-minutes-20261001
    paths:
      - scripts/run_mm_final_ablation.py
      - .github/workflows/mm-final-ablation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mm-final-ablation
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
          pip install requests
      - name: Run final MM ablation
        id: mm
        shell: bash
        run: |
          set +e
          rm -rf analysis/results/mm-final-ablation-20261006-v1
          mkdir -p analysis/results/mm-final-ablation-20261006-v1
          PYTHONPATH=src python scripts/run_mm_final_ablation.py 2>&1 | tee analysis/results/mm-final-ablation-20261006-v1/run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/results/mm-final-ablation-20261006-v1
          git commit -m "results: MM final structural ablation" || exit 0
          git pull --rebase origin audit-role-minutes-20261001 || exit 1
          git push origin HEAD:audit-role-minutes-20261001
      - name: Fail if audit failed
        if: steps.mm.outputs.exit_code != '0'
        run: exit 1
