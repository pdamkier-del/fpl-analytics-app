name: Weekly season model review
on:
  push:
    branches: [main]
    paths: [.github/workflows/weekly-model-review-publication.yml]
  schedule:
    - cron: '0 8 * * 2'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
jobs:
  review:
    uses: pdamkier-del/fpl-analytics-app/.github/workflows/weekly-model-review.yml@80d2e1d6ef08626055ab96e14ea67e14bc45feed
    with:
      source_ref: 80d2e1d6ef08626055ab96e14ea67e14bc45feed
