name: Weekly season model review
on:
  push:
    branches: [main]
    paths: [.github/workflows/weekly-model-review-publication.yml]
  schedule:
    - cron: '0 8 * * 2'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
jobs:
  review:
    uses: pdamkier-del/fpl-analytics-app/.github/workflows/weekly-model-review.yml@0b9a85436a6e4d89e757afa6431bb576d90b4b22
    with:
      source_ref: 0b9a85436a6e4d89e757afa6431bb576d90b4b22
