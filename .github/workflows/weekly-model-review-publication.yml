name: Weekly season model review
on:
  push:
    branches: [main]
    paths: [.github/workflows/weekly-model-review-publication.yml]
  schedule:
    - cron: '0 8 * * 2'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
jobs:
  review:
    uses: pdamkier-del/fpl-analytics-app/.github/workflows/weekly-model-review.yml@0bdd51eeb2dd895ac2b0bfa8499b26bd0f4d91a1
    with:
      source_ref: 0bdd51eeb2dd895ac2b0bfa8499b26bd0f4d91a1
