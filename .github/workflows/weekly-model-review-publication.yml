name: Weekly season model review
on:
  push:
    branches: [main]
    paths: [.github/workflows/weekly-model-review-publication.yml]
  schedule:
    - cron: '0 8 * * 2'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
jobs:
  review:
    uses: pdamkier-del/fpl-analytics-app/.github/workflows/weekly-model-review.yml@ab6b0043e53c55b1948b9ea963e16580ae8910df
    with:
      source_ref: ab6b0043e53c55b1948b9ea963e16580ae8910df
