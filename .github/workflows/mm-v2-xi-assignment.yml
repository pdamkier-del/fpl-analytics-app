name: MM v2 XI assignment audit

on:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_mm_v2_xi_rating_experiment.py'
      - '.github/workflows/mm-v2-xi-assignment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mm-v2-xi-assignment
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
          pip install requests
      - name: Run XI-only experiment
        id: exp
        shell: bash
        run: |
          set +e
          rm -rf analysis/results/mm-v2-xi-rating-20261006-v1
          mkdir -p analysis/results/mm-v2-xi-rating-20261006-v1
          PYTHONPATH=src python scripts/run_mm_v2_xi_rating_experiment.py 2>&1 | tee analysis/results/mm-v2-xi-rating-20261006-v1/run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/results/mm-v2-xi-rating-20261006-v1
          git commit -m "results: MM v2 XI assignment audit" || exit 0
          git pull --rebase origin audit-role-minutes-20261001
          git push origin HEAD:audit-role-minutes-20261001
      - name: Fail if experiment failed
        if: steps.exp.outputs.exit_code != '0'
        run: exit 1
