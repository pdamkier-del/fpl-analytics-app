name: Conditional 2024-25 locked chain GW6-38

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - '.github/workflows/conditional-2024-25-gw6-38.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas==2.2.3 numpy==2.3.5 scipy scikit-learn requests
      - name: Restore inputs
        run: |
          mkdir -p work
          cat model/checkpoints/phase5e_core/parts/core.gz.part-* | gzip -dc > work/core.sqlite3
          python scripts/restore_2024_25_data_checkpoint.py
          python -m unittest discover -s tests -p test_2024_25_data_audit.py -v
      - name: Conditional locked MM
        run: |
          rm -rf analysis/results/conditional-2024-25-mm
          PYTHONPATH=src python scripts/run_2024_25_conditional_mm.py \
            --db work/core.sqlite3 \
            --derived data_v1_1/derived/season_2024_25_v1 \
            --out analysis/results/conditional-2024-25-mm
      - name: Conditional rolling vFinal PM
        run: |
          rm -rf analysis/results/conditional-2024-25-pm
          PYTHONPATH=src python scripts/run_2024_25_conditional_pm.py \
            --db work/core.sqlite3 \
            --derived data_v1_1/derived/season_2024_25_v1 \
            --source analysis/results/conditional-2024-25-mm/conditional_feature_frame.csv.gz \
            --mm analysis/results/conditional-2024-25-mm/locked_mm_predictions.csv.gz \
            --out analysis/results/conditional-2024-25-pm \
            --start-origin 6 --end-origin 38
      - name: Locked TS v3 GW6-38
        run: |
          rm -rf analysis/results/conditional-2024-25-ts-gw6-38
          PYTHONPATH=src python scripts/run_2024_25_conditional_ts_gw6_38.py \
            --derived data_v1_1/derived/season_2024_25_v1 \
            --vfinal analysis/results/conditional-2024-25-pm/rolling_vfinal_forecast.csv.gz \
            --out analysis/results/conditional-2024-25-ts-gw6-38 \
            --start-gw 6 --end-gw 38
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditional-2024-25-locked-chain-gw6-38
          path: |
            analysis/results/conditional-2024-25-mm
            analysis/results/conditional-2024-25-pm
            analysis/results/conditional-2024-25-ts-gw6-38
          retention-days: 90

# trigger locked Match Importance adapter
