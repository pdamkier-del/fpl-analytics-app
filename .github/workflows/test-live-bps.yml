name: Validate frozen 2026 BPS integration
on:
  push:
    branches: [free-github-static-20261010]
    paths:
      - scripts/run_live_vfinal_bps.py
      - tests/test_run_live_vfinal_bps.py
      - .github/workflows/test-live-bps.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt
      - run: PYTHONPATH=src:scripts python -m pytest tests/test_run_live_vfinal_bps.py -q
