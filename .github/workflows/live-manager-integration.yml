name: Current vFinal to original TS and all chip adapters
on:
  push:
    branches: [free-github-static-20261010]
    paths: ['scripts/run_live_tc_scenarios.py', 'scripts/run_live_locked_ts.py', 'scripts/validate_live_manager_chain.py', '.github/workflows/live-manager-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - run: python scripts/restore_live_vfinal_checkpoint.py --checkpoint model/checkpoints/live_gw7_sources_20261010_v1
      - run: python scripts/restore_live_vfinal_checkpoint.py --checkpoint model/checkpoints/live_vfinal_gw7_20261010_v2
      - run: python scripts/build_live_vfinal_desktop.py
      - run: python scripts/locked_numerical_runtime.py scripts/run_live_tc_scenarios.py
      - run: python scripts/locked_numerical_runtime.py scripts/validate_live_manager_chain.py
      - name: Run all repository regression tests
        run: PYTHONPATH=src python -m pytest -q tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-original-manager-chain-diagnostic
          path: work/live-manager-validation/
          retention-days: 90
