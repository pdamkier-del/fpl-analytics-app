name: FH WC empirically calibrated replay
on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_joint_fh_wc_calibrated.py'
      - 'scripts/run_joint_gw6_stress_calibrated.py'
      - 'scripts/joint_chip_historical_priors.py'
      - 'src/fpl_xpts/joint_chip_stopping.py'
      - '.github/workflows/joint-fh-wc-calibrated.yml'
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas==2.2.3 numpy==2.3.5 scipy scikit-learn requests pytest
      - name: Fetch locked TS 2025-26
        uses: actions/download-artifact@v4
        with:
          name: final-locked-chain-gw1-38
          path: work/locked2125
          github-token: ${{ github.token }}
          run-id: 37612845586
      - name: Fetch historical BGW/DGW priors
        uses: actions/download-artifact@v4
        with:
          name: fh-mc-v3
          path: work/structural-history
          github-token: ${{ github.token }}
          run-id: 37899491409
      - name: Fetch prior-season WC marginal values
        uses: actions/download-artifact@v4
        with:
          name: wc-ts-2024-conditional
          path: work/wc-history
          github-token: ${{ github.token }}
          run-id: 37911309255
      - name: Fetch historical availability shock calibration
        uses: actions/download-artifact@v4
        with:
          name: squad-shock-calibration
          path: work/availability-history
          github-token: ${{ github.token }}
          run-id: 37913868798
      - name: Test stochastic Bellman model
        run: PYTHONPATH=src pytest -q tests/test_joint_chip_stopping.py
      - name: Replay 2025-26 using calibration from previous seasons
        run: |
          VF=$(find work/locked2125 -name rolling_vfinal_forecast.csv.gz | head -1)
          STRUCT=$(find work/structural-history -name mc_structural_by_gw.csv | head -1)
          CAL=$(find work/availability-history -name availability_calibration.json | head -1)
          test -n "$VF"; test -n "$STRUCT"; test -n "$CAL"
          PYTHONPATH=src:scripts python scripts/run_joint_fh_wc_calibrated.py --vfinal "$VF" --structural "$STRUCT" --availability "$CAL" --wc-history work/wc-history --out analysis/results/joint-fh-wc-calibrated
      - name: Recheck GW6 healthy and injury-stress cases
        run: |
          VF=$(find work/locked2125 -name rolling_vfinal_forecast.csv.gz | head -1)
          STRUCT=$(find work/structural-history -name mc_structural_by_gw.csv | head -1)
          CAL=$(find work/availability-history -name availability_calibration.json | head -1)
          PYTHONPATH=src:scripts python scripts/run_joint_gw6_stress_calibrated.py --vfinal "$VF" --structural "$STRUCT" --availability "$CAL" --wc-history work/wc-history --out analysis/results/joint-gw6-stress-calibrated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-fh-wc-calibrated
          path: |
            analysis/results/joint-fh-wc-calibrated
            analysis/results/joint-gw6-stress-calibrated
          retention-days: 90
