name: Two exact canonical raw rebuilds of original MM and vFinal
on:
  push:
    branches: [free-github-static-20261010]
    paths: ['scripts/locked_numerical_runtime.py', 'scripts/verify_canonical_raw_rebuild.py', '.github/workflows/live-canonical-raw-rebuild.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - run: python scripts/restore_live_input_checkpoint.py --out .
      - name: Restore real archived predeadline cohorts
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_archived_fpl_gw1_5.py
      - run: PYTHONPATH=src python -m pytest -q tests/test_live_raw_reproduction.py tests/test_live_locked_ts_bridge.py
      - run: python scripts/locked_numerical_runtime.py scripts/verify_canonical_raw_rebuild.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-original-mm-vfinal-raw-rebuild
          path: |
            work/live-final-model/canonical_raw_rebuild.json
            data_v1_1/derived/live_locked_inputs/2026-27-v1/*
            work/live-final-model/mm_frozen_diagnostic_six_gw.csv.gz
          retention-days: 90
