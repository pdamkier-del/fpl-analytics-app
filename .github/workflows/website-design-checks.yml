name: Website design checks

on:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'app/**'
      - 'tests/test_model_tree_navigation.py'
      - 'tests/model-tree-ui-smoke.js'
      - 'tests/forecast-center-ui-smoke.js'
      - 'tests/test_forecast_preview.py'
      - 'tests/test_publisher_bundle.py'
      - 'tests/test_live_snapshot.py'
      - 'scripts/snapshot_fpl_schedule.py'
      - 'model/forecast_preview.py'
      - 'start_app.py'
      - 'scripts/publish_fpl_update.py'
      - '.github/workflows/publish-fpl-update.yml'
      - '.github/workflows/website-design-checks.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python
        run: python -m py_compile scripts/publish_fpl_update.py scripts/snapshot_fpl_schedule.py start_app.py updater.py model/forecast_preview.py
      - name: Validate all model tree scripts and existing navigation
        run: |
          node --check app/nav.js
          node --check app/model-tree-data.js
          node --check app/model-tree-ui.js
      - name: Verify locked model math, source links and tree structure
        run: python tests/test_model_tree_navigation.py
      - name: Test model tree in a browser-like DOM
        run: |
          npm install --no-save --no-package-lock jsdom@24
          node tests/model-tree-ui-smoke.js
          node tests/forecast-center-ui-smoke.js
      - name: Verify live forecast preview and chip candidate provenance
        run: python tests/test_forecast_preview.py
      - name: Check offline official FPL fixture and player availability snapshot
        run: python tests/test_live_snapshot.py
      - name: Verify one-click publisher bundle includes locked code and dashboard
        run: python tests/test_publisher_bundle.py
      - name: Validate HTML links and required pages
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          required=['index.html','player.html','models.html','overview.html','rankings.html','forecast-center.html']
          for name in required:
              p=Path('app')/name
              assert p.exists() and p.stat().st_size>100, name
              class P(HTMLParser): pass
              P().feed(p.read_text(encoding='utf-8'))
          print('frontend structure ok')
          PY
