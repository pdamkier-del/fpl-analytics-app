name: FH-aware TS full-season comparison

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - '.github/workflows/fh-aware-ts-full-season.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas numpy scipy scikit-learn requests
      - name: Download authoritative locked 2125 chain
        uses: actions/download-artifact@v4
        with:
          name: final-locked-chain-gw1-38
          path: work/locked2125
          github-token: ${{ github.token }}
          run-id: 37612845586
      - name: Compare baseline and FH-aware TS
        run: |
          rm -rf analysis/results/fh-aware-ts-full-season-2025-26
          VF=$(find work/locked2125 -name rolling_vfinal_forecast.csv.gz | head -1)
          test -n "$VF"
          PYTHONPATH=src python scripts/run_fh_aware_ts_comparison.py --vfinal "$VF" --out analysis/results/fh-aware-ts-full-season-2025-26
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fh-aware-ts-full-season-2025-26
          path: analysis/results/fh-aware-ts-full-season-2025-26
          retention-days: 90
