name: MM relative MI v2 ablation

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_mm_relative_mi_v2_ablation.py'
      - '.github/workflows/mm-relative-mi-v2-ablation.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas numpy scikit-learn requests
      - run: PYTHONPATH=src python scripts/run_mm_relative_mi_v2_ablation.py
      - uses: actions/upload-artifact@v4
        with:
          name: mm-relative-mi-v2-ablation-20261006-v1
          path: analysis/results/mm-relative-mi-v2-ablation-20261006-v1
          retention-days: 90
