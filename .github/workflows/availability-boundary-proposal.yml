name: Approved MM availability release export tests (not full final chain)
on:
  push:
    branches: [free-github-static-20261010]
    paths:
      - 'src/fpl_v1_1_model/live_availability_boundary.py'
      - 'tests/test_live_availability_boundary.py'
      - 'scripts/export_mm_release.py'
      - 'tests/test_mm_live_release_export.py'
      - 'scripts/publish_final_model.py'
      - 'tests/test_final_publish_availability_gate.py'
      - '.github/workflows/availability-boundary-proposal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical environment and pytest
        run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - name: Test full MM release export CLI and preserve frozen historical model
        run: PYTHONPATH=src:scripts python -m pytest -q tests/test_mm_live_release_export.py tests/test_final_publish_availability_gate.py tests/test_live_availability_boundary.py tests/test_live_locked_inputs.py tests/test_mm_release.py
      - name: Confirm frozen runner functions unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          frozen=Path("scripts/run_mm_unified_official_roles.py").read_text()
          assert "def compose(frame,p,q,sub)" in frozen
          assert "return p*frame.start_minutes_mean.to_numpy(float)+(1-p)*q*np.asarray(sub,float)" in frozen
          print("Frozen compose formula remains intact; approved export boundary is not a live final model")
          PY
