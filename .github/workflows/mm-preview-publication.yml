name: Publish isolated validated MM preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/mm-preview-publication.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
env:
  PREVIEW_SOURCE_SHA: 51488f30d18ff8a9b57fb5c481486c1b42b6b822
jobs:
  verified-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    outputs:
      run: ${{ steps.origin.outputs.run }}
    steps:
      - name: Require successful exact-source MM validation and let existing publications finish
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,time
          repo='pdamkier-del/fpl-analytics-app'
          def get(path):return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True))
          end=time.monotonic()+1800
          while time.monotonic()<end:
              runs=get('actions/runs?per_page=100')['workflow_runs']
              matches=[r for r in runs if r['head_sha']==os.environ['PREVIEW_SOURCE_SHA'] and r['path']=='.github/workflows/mm-desktop-probabilities.yml']
              if matches and matches[0]['status']=='completed' and matches[0]['conclusion']!='success':raise SystemExit('Exact-source MM validation failed')
              busy=[r for r in runs if r['path'] in ['.github/workflows/free-pages.yml','.github/workflows/current-diagnostic-forecast.yml'] and r['status'] in ['queued','in_progress','waiting','pending']]
              if matches and matches[0]['conclusion']=='success' and not busy:
                  with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('run='+str(matches[0]['id'])+'\n')
                  print('Validated source',matches[0]['head_sha'],'run',matches[0]['id'])
                  break
              print('Waiting for exact-source validation / existing production publication',flush=True)
              time.sleep(15)
          else:raise SystemExit('No quiet verified publication window within30 minutes; production preserved')
          PY
  preview:
    needs: verified-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fpl-pages-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://pdamkier-del.github.io/fpl-analytics-app/mm-preview/live.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: mm-desktop-probabilities-preview
          path: .mm-preview-evidence
          run-id: ${{ needs.verified-artifact.outputs.run }}
          github-token: ${{ github.token }}
      - name: Use only actually validated public MM output
        run: cp -R .mm-preview-evidence/. app/mm-preview/
      - name: Publish preview path without rebuilding or changing production forecasts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_mm_preview.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .mm-preview-site
          name: mm-preview-pages-${{ github.run_id }}
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: mm-preview-pages-${{ github.run_id }}
