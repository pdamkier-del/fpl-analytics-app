name: Fresh original locked diagnostic forecast
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Explicit hour range preserves :17 hourly and re-registers the cron actor.
    - cron: '17 0-23 * * *'
  push:
    branches: [main]
    paths: [.github/workflows/current-diagnostic-forecast.yml]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: original-current-diagnostic
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      snapshot: ${{ steps.publication.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-github-static-20261010
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests Flask==3.1.2
      - name: Restore verified historical inputs and latest diagnostic snapshot
        run: |
          python scripts/restore_live_input_checkpoint.py --out .
          python scripts/restore_live_vfinal_checkpoint.py --checkpoint model/checkpoints/live_gw7_sources_20261010_v1
          python scripts/current_diagnostic_checkpoint.py restore
      # Collector includes verified provisional full-time matches in partial GWs;
      # retains the existing kickoff + 4h cutoff gate and frozen model equations.
      - name: Capture fresh sources, replay original chain twice and verify subset parity
        run: python scripts/locked_numerical_runtime.py scripts/run_current_diagnostic_pipeline.py
      - name: Run original regression and presentation checks
        run: |
          PYTHONPATH=src python -m pytest -q tests
          node tests/test_forecast_window.js
          node --check app/manager-online.js
          node --check app/weekly-app.js
          node --check app/manager-state.js
          node --check app/plan-view.js
      - name: Preserve cutoff-matched examples, immutable raw data and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/current_diagnostic_checkpoint.py package
          tag=$(python -c "import json; print(json.load(open('model/checkpoints/current-diagnostic.json'))['tag'])")
          gh release create "$tag" work/diagnostic-snapshot.zip --target free-github-static-20261010 --title "$tag" --notes 'Verified original diagnostic snapshot. Model remains uncertified. Checksums retained in model/checkpoints/releases.'
      - name: Commit verified forecast without replacing concurrent manager or code changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/vfinal-diagnostic.json app/integration-validation.json model/checkpoints/current-diagnostic.json model/checkpoints/releases
          git commit -m 'Publish freshly reproduced original diagnostic forecast'
          git restore .
          for attempt in 1 2 3; do
            git pull --rebase origin free-github-static-20261010
            if git push origin HEAD:free-github-static-20261010; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Refresh official display data from the same latest GW
        run: python scripts/fetch_live_fixtures.py
      - name: Publish cutoff-matched weekly display and TC assets
        run: python scripts/publish_weekly_assets.py
      - uses: actions/configure-pages@v5
      - run: touch app/.nojekyll
      - name: Record verified publication identity
        id: publication
        run: python scripts/verify_pages_publication.py --record
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-diagnostic-run-evidence
          path: |
            work/live-final-model/*audit.json
            work/live-final-model/canonical_raw_rebuild.json
            work/live-final-model/source_manifest.json
            work/live-final-model/publication_provenance.json
            work/live-manager-validation/tc_scenarios.json
          retention-days: 30
  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    concurrency:
      group: fpl-pages-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-github-static-20261010
      - name: Refuse an older forecast after waiting for publication
        env:
          PAGES_SNAPSHOT: ${{ needs.forecast.outputs.snapshot }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_pages_publication.py
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  report:
    if: always()
    needs: [forecast, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-github-static-20261010
      - name: Report actual forecast and publication outcome
        env:
          FORECAST_JOB_STATUS: ${{ contains(needs.*.result, 'cancelled') && 'cancelled' || (needs.forecast.result == 'success' && needs.deploy.result == 'success' && 'success' || 'failure') }}
          FORECAST_TRIGGER: ${{ github.event_name }}
          FORECAST_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_pipeline_status.py
