name: Joao Pedro MM minutes forensic
on:
  push:
    branches: [free-github-static-20261010]
    paths:
      - scripts/audit_joao_pedro_mm.py
      - scripts/experiment_mm_deadline_workload.py
      - scripts/audit_mm_return_after_absence.py
      - .github/workflows/joao-pedro-mm-forensic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checkpoint numerical dependencies
        run: pip install -r requirements-model-checkpoint.txt requests
      - name: Restore exact released diagnostic inputs
        run: python scripts/current_diagnostic_checkpoint.py restore
      - name: Explain João Pedro 58 xM without modifying predictions
        run: python scripts/audit_joao_pedro_mm.py
      - name: Compare existing MM with workload features projected to each upcoming deadline
        run: python scripts/experiment_mm_deadline_workload.py
      - name: Audit MM accuracy after one-game absences on historical 2025-26 cohort
        run: python scripts/audit_mm_return_after_absence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joao-pedro-mm-forensic
          path: |
            work/live-final-model/joao_pedro_mm_forensic.json
            work/live-final-model/joao_mm_workload_deadline_ab.json
            work/live-final-model/mm_return_absence_calibration.json
          retention-days: 30
