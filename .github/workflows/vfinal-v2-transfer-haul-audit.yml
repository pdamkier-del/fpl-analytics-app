name: vFinal v2 transfer and haul audit
on:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_vfinal_v2_transfer_big_haul_audit.py'
      - '.github/workflows/vfinal-v2-transfer-haul-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt
      - name: Download old proxy
        uses: actions/download-artifact@v4
        with:
          name: pm-ts-vfinal-fullhorizon-proxy
          path: analysis/results/deep_audit_inputs/old
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37445455546
      - name: Download new proxy v2
        uses: actions/download-artifact@v4
        with:
          name: pm-ts-vfinal-fullhorizon-proxy-v2
          path: analysis/results/deep_audit_inputs/new
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37452172061
      - name: Download Phase5Q baseline state
        uses: actions/download-artifact@v4
        with:
          name: ts-v4-joint-replay-resumed
          path: analysis/results/deep_audit_inputs/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37433364153
      - run: PYTHONPATH=src python scripts/run_vfinal_v2_transfer_big_haul_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vfinal-v2-transfer-big-haul-audit
          path: analysis/results/vfinal-v2-transfer-big-haul-audit-20261006-v1
