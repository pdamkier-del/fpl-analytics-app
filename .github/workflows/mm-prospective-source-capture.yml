name: Capture public predeadline MM source evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: [.github/workflows/mm-prospective-source-capture.yml]
permissions:
  contents: read
concurrency:
  group: mm-prospective-source-evidence
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 574e61964bcf7526beba13079deef418853ff224
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture official sources and verified current roster; B producer remains blocked
        run: python scripts/capture_mm_prospective.py --out work/mm-prospective-source-evidence
      - name: Verify captured official roster is NOT a B prediction
        run: |
          python - <<'PY'
          import json,pathlib
          docs=list(pathlib.Path('work/mm-prospective-source-evidence').glob('*/official-roster.json'))
          assert len(docs)==1, 'Source capture must create one official roster'
          roster=json.loads(docs[0].read_text())
          assert roster['scope']=='official_identity_fixture_skeleton_not_B_features'
          assert roster['model_ready'] is False
          assert len(roster['rows'])==roster['roster_rows']
          assert roster['roster_rows']>0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-mm-source-evidence-${{ github.run_id }}
          path: work/mm-prospective-source-evidence/
          retention-days: 90
          compression-level: 9
