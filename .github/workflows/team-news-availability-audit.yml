name: Team News availability research audit
on:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - scripts/audit_fpl_team_news.py
      - scripts/restore_team_news_audit.py
      - scripts/validate_team_news_audit.py
      - scripts/research_team_news_sources.py
      - tests/test_team_news_audit.py
      - .github/workflows/team-news-availability-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/team-news-audit
          key: team-news-audit-v1-${{ github.run_id }}
          restore-keys: team-news-audit-v1-
      - run: |
          if [ ! -f analysis/results/team-news-source-research-20261006-v1/sources.json ]; then
            python scripts/research_team_news_sources.py
          fi
      - run: python tests/test_team_news_audit.py
      - run: |
          if [ -f data_v1_1/derived/team_news_audit/2025-26-v2/PARTS_MANIFEST.json ]; then
            python scripts/restore_team_news_audit.py
          else
            python scripts/restore_core_checkpoint.py --out work/core.sqlite3
            python scripts/audit_fpl_team_news.py --out data_v1_1/derived/team_news_audit/2025-26-v2
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          python scripts/audit_fpl_team_news.py --rebuild data_v1_1/derived/team_news_audit/2025-26-v2 --out work/team-news-offline-rebuild
          cmp data_v1_1/derived/team_news_audit/2025-26-v2/SHA256_MANIFEST.json work/team-news-offline-rebuild/SHA256_MANIFEST.json
          python scripts/validate_team_news_audit.py --out work/team-news-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-news-availability-audit
          path: |
            data_v1_1/derived/team_news_audit/2025-26-v2
            analysis/results/team-news-source-research-20261006-v1
          retention-days: 90
