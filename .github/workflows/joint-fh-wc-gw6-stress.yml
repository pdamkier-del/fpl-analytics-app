name: FH WC GW6 injury stress test
on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_joint_gw6_stress.py'
      - 'src/fpl_xpts/joint_chip_stopping.py'
      - '.github/workflows/joint-fh-wc-gw6-stress.yml'
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas==2.2.3 numpy==2.3.5 scipy scikit-learn requests pytest
      - name: Fetch locked TS 2025-26
        uses: actions/download-artifact@v4
        with:
          name: final-locked-chain-gw1-38
          path: work/locked2125
          github-token: ${{ github.token }}
          run-id: 37612845586
      - name: Fetch historical BGW/DGW priors
        uses: actions/download-artifact@v4
        with:
          name: fh-mc-v3
          path: work/structural-history
          github-token: ${{ github.token }}
          run-id: 37899491409
      - name: Test stochastic Bellman model
        run: PYTHONPATH=src pytest -q tests/test_joint_chip_stopping.py
      - name: Stress GW6 team with three short or long absences
        run: |
          VF=$(find work/locked2125 -name rolling_vfinal_forecast.csv.gz | head -1)
          STRUCT=$(find work/structural-history -name mc_structural_by_gw.csv | head -1)
          test -n "$VF"
          test -n "$STRUCT"
          PYTHONPATH=src:scripts python scripts/run_joint_gw6_stress.py --vfinal "$VF" --structural "$STRUCT" --out analysis/results/joint-gw6-stress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-gw6-stress
          path: analysis/results/joint-gw6-stress
          retention-days: 90
