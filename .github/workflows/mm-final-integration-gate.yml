name: MM final candidate integration gate
on:
  push:
    branches: [research-mm-final-integration-gate-20261017]
    paths:
      - scripts/research_mm_final_integration_gate.py
      - .github/workflows/mm-final-integration-gate.yml
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONPATH: src:scripts:.
  OPENBLAS_NUM_THREADS: '1'
jobs:
  integration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - name: Verify frozen inputs
        run: |
          sha256sum analysis/results/individual-mm-refinement-20261016/predictions.npz analysis/results/mm-formation-replay-20261017/xi_fixtures.csv analysis/results/mm-predictive-distribution-20261017/distributions.csv.gz > /tmp/mminputs.sha
      - name: Execute combined evidence gate
        run: python scripts/research_mm_final_integration_gate.py
      - name: Protect previous models and data
        run: |
          sha256sum --check /tmp/mminputs.sha
          git diff --exit-code HEAD -- src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mm-final-integration-gate
          path: analysis/results/mm-final-integration-gate-20261017/
      - name: Preserve scientific evidence
        run: |
          git config user.name 'FPL MM research evidence'
          git config user.email 'research-evidence@users.noreply.github.com'
          git add analysis/results/mm-final-integration-gate-20261017/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record MM ensemble evaluation and production gating'
          git push origin HEAD:research-mm-final-integration-gate-20261017
