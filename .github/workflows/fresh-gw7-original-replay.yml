name: Fresh GW7 original MM to vFinal exact six-GW replay
on:
  push:
    branches: [free-github-static-20261010]
    paths: ['model/checkpoints/live_gw7_sources_20261010_v1/**', '.github/workflows/fresh-gw7-original-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - run: python scripts/restore_live_vfinal_checkpoint.py --checkpoint model/checkpoints/live_gw7_sources_20261010_v1
      - name: Restore original past predeadline cohorts
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_archived_fpl_gw1_5.py
      - name: Test complete raw rebuild twice at the exact fresh cutoff
        run: python scripts/locked_numerical_runtime.py scripts/verify_canonical_raw_rebuild.py
      - name: One actual match and one whole fresh GW
        run: |
          python scripts/locked_numerical_runtime.py scripts/run_live_vfinal_joint_simulation.py --scope one-match --input data_v1_1/derived/live_locked_inputs/2026-27-v1/vfinal_live_full_simulator_input.csv.gz --out data_v1_1/derived/live_locked_inputs/2026-27-v1/one_match_xp.csv.gz
          python scripts/locked_numerical_runtime.py scripts/run_live_vfinal_joint_simulation.py --scope one-gw --input data_v1_1/derived/live_locked_inputs/2026-27-v1/vfinal_live_full_simulator_input.csv.gz --out data_v1_1/derived/live_locked_inputs/2026-27-v1/one_gw_xp.csv.gz
          python scripts/audit_live_vfinal_outputs.py
          python scripts/build_live_vfinal_desktop.py
          PYTHONPATH=src python -m pytest -q tests/test_live_locked_ts_bridge.py tests/test_final_fpl_chain.py tests/test_live_vfinal_desktop.py tests/test_live_raw_reproduction.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-gw7-original-vfinal-replay
          path: |
            work/live-final-model/
            data_v1_1/derived/live_locked_inputs/2026-27-v1/
            app/vfinal-diagnostic.json
          retention-days: 90
