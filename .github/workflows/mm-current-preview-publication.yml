name: Refresh isolated current B preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/mm-current-preview-publication.yml]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      publish_app_completion_preview:
        description: "After branch permission approval: publish the separately verified preview"
        type: boolean
        default: false
      app_completion_preview:
        description: "Publish isolated team/transfers UI preview; preserve all live Pages files"
        type: boolean
        default: false
      validated_run:
        description: 'Optional successful exact-source mm-current-live-preview run to publish without recomputation'
        required: false
        type: string
      validate_gk_cap_candidate:
        description: 'Verify pinned GK cap correction on the integration branch only'
        required: false
        type: boolean
        default: false
      replay_gk_cap_browser:
        description: 'Run browser checks only on the verified capture from run 45783017558'
        required: false
        type: boolean
        default: false
      publish_gk_cap_test:
        description: 'Publish only the verified GW12 existing-app test path on Pages'
        required: false
        type: boolean
        default: false
      ui_only:
        description: 'Preserve the live forecast and publish the navigation/UI only'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
env:
  PREVIEW_SOURCE_SHA: 161b67b6fb8786a38e78c245b92a03ad841575d8
  PREVIEW_UI_SHA: 27bf5e1e1a17360bdbbfb41fbce7fe55679c6870
jobs:
  verified:
    if: ${{ !inputs.app_completion_preview && inputs.validated_run != '' && !inputs.validate_gk_cap_candidate && !inputs.replay_gk_cap_browser && github.ref != 'refs/heads/integration/stable-live-app-20261122' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_UI_SHA }}
      - name: Require a completed exact-source numerical computation
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN: ${{ inputs.validated_run }}
        run: python scripts/verify_b_publication_artifact.py --run "$VALIDATED_RUN" --source "$PREVIEW_SOURCE_SHA"
  current:
    if: ${{ !inputs.app_completion_preview && inputs.validated_run == '' && !inputs.validate_gk_cap_candidate && !inputs.replay_gk_cap_browser && github.ref != 'refs/heads/integration/stable-live-app-20261122' }}
    uses: pdamkier-del/fpl-analytics-app/.github/workflows/mm-current-live-preview.yml@161b67b6fb8786a38e78c245b92a03ad841575d8
    with:
      source_ref: 161b67b6fb8786a38e78c245b92a03ad841575d8
      validated_history_run: '41216503954'
    permissions:
      contents: read
      actions: read
  gk_cap_candidate:
    if: ${{ !inputs.app_completion_preview && github.ref == 'refs/heads/integration/stable-live-app-20261122' && github.event_name == 'workflow_dispatch' && !inputs.replay_gk_cap_browser && inputs.validated_run == '' }}
    concurrency:
      group: fpl-approved-test-forecast
      cancel-in-progress: false
    uses: pdamkier-del/fpl-analytics-app/.github/workflows/mm-current-live-preview.yml@161b67b6fb8786a38e78c245b92a03ad841575d8
    with:
      source_ref: d7060b51cf16016f7947b2ffc110909afea89bb7
    permissions:
      contents: read
      actions: read
  gk_cap_browser:
    needs: gk_cap_candidate
    if: ${{ !inputs.app_completion_preview && !cancelled() && (needs.gk_cap_candidate.result == 'success' || (github.ref == 'refs/heads/integration/stable-live-app-20261122' && inputs.replay_gk_cap_browser && !inputs.validate_gk_cap_candidate && inputs.validated_run == '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_UI_SHA }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .c2-integration
          sparse-checkout: integration/model-interface
          persist-credentials: false
      - name: Verify the original producer succeeded
        if: inputs.replay_gk_cap_browser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45783017558/jobs" \
            --jq '[.jobs[] | select(.id == 139782825698 and .conclusion == "success")] | length' | grep -qx 1
      - uses: actions/download-artifact@v4
        with:
          name: mm-current-live-preview
          path: candidate-capture
          run-id: ${{ inputs.replay_gk_cap_browser && '45783017558' || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the candidate in the existing app
        run: |
          pip install requests
          npm install --prefix "$RUNNER_TEMP/fpl-browser" playwright@1.56.1
          export NODE_PATH="$RUNNER_TEMP/fpl-browser/node_modules"
          export BROWSER_PATH="$(command -v google-chrome)"
          export FPL_PREVIEW_URL=http://127.0.0.1:18097/mm-preview/app/
          export FPL_ALLOW_HISTORICAL="${{ inputs.replay_gk_cap_browser }}"
          export FPL_EXPECT_LIVE_GW="$(jq -er '.gws[0]' candidate-capture/current/forecast.json)"
          export FPL_TEST_WORKER_FILE="$PWD/app/mm-preview/app/preview-sw.js"
          mkdir -p app/mm-preview/{current,gk}
          cp -a candidate-capture/current/. app/mm-preview/current/
          cp -a candidate-capture/gk/. app/mm-preview/gk/
          cmp app/mm-preview/{current,gk}/forecast.json
          python - <<'PYTHON'
          import json
          from pathlib import Path
          forecast = json.loads(Path('app/mm-preview/current/forecast.json').read_text())
          assert forecast['gws'] == list(range(forecast['gws'][0], forecast['gws'][0] + 6))
          assert forecast['gk_team_fixtures']
          assert all(row['reserve_cap_policy'] == 'B-GK-saturated-availability-v1'
                     for row in forecast['gk_team_fixtures'])
          for row in forecast['gk_team_fixtures']:
              if row.get('reserve_cap_correction'):
                  print(row['team'], row['fixture_uuid'], row['reserve_cap_correction'])
          PYTHON
          python scripts/collect_dashboard_news.py
          python scripts/integrate_desktop_probabilities.py
          python .c2-integration/integration/model-interface/preview-overlay.py app/mm-preview/app
          node --test .c2-integration/integration/model-interface/*.test.js
          printf '{"url":null,"status":"isolated_validation"}\n' > app/manager-service.json
          python -m http.server 18097 --bind 127.0.0.1 --directory app > "$RUNNER_TEMP/c2-candidate-http.log" 2>&1 &
          preview_http_pid=$!
          trap 'kill "$preview_http_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS -o /dev/null "${FPL_PREVIEW_URL}overview.html"; then break; fi
            sleep 1
          done
          node .c2-integration/integration/model-interface/preview-smoke.cjs
          cmp candidate-capture/current/forecast.json app/mm-preview/current/forecast.json
      - uses: actions/upload-artifact@v4
        if: (!inputs.replay_gk_cap_browser && !inputs.validate_gk_cap_candidate) || (inputs.replay_gk_cap_browser && inputs.publish_gk_cap_test)
        with:
          name: gw12-tested-app
          path: |
            app/mm-preview/app
            app/mm-preview/current
            app/mm-preview/gk
            app/mm-preview/news
            app/mm-preview/*.js
            app/mm-preview/*.css
          retention-days: 1
  publish_gk_cap_test:
    needs: gk_cap_browser
    if: ${{ !inputs.app_completion_preview && !cancelled() && needs.gk_cap_browser.result == 'success' && github.ref == 'refs/heads/integration/stable-live-app-20261122' && ((!inputs.replay_gk_cap_browser && !inputs.validate_gk_cap_candidate) || (inputs.replay_gk_cap_browser && inputs.publish_gk_cap_test)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fpl-pages-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://pdamkier-del.github.io/fpl-analytics-app/mm-preview/app/manager-state.html
    steps:
      - name: Resolve the exact live Pages baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live_run=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=20" --jq '.[].id' |
            while read -r deployment; do
              gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses" --jq 'map(select(.state == "success")) | .[0].log_url // empty'
            done | sed -n 's|.*/actions/runs/\([0-9]*\)/job/.*|\1|p' | awk 'NR == 1')
          test -n "$live_run"
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$live_run/artifacts" \
            --jq '[.artifacts[] | select((.expired | not) and (.name | test("^(gw12-test-pages-|team-news-pages-|github-pages-|mm-current-preview-pages-|recovered-B-pages-)")))] | max_by(.created_at) | .name // empty')
          test -n "$artifact"
          printf 'run=%s\nartifact=%s\n' "$live_run" "$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.artifact }}
          run-id: ${{ steps.baseline.outputs.run }}
          github-token: ${{ github.token }}
          path: pages-baseline
      - uses: actions/download-artifact@v4
        with:
          name: gw12-tested-app
          path: tested-app
      - name: Overlay public test files only
        env:
          REPLAY_CAPTURE: ${{ inputs.replay_gk_cap_browser }}
          UI_ONLY: ${{ inputs.ui_only }}
        run: |
          mkdir site
          tar -xf pages-baseline/artifact.tar -C site
          python - <<'PYTHON'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import json
          import os
          import shutil

          source = Path('tested-app')
          site = Path('site')
          preview = site / 'mm-preview'
          if os.environ['UI_ONLY'] == 'true':
              assert os.environ['REPLAY_CAPTURE'] == 'true'
              shutil.copytree(source / 'app', preview / 'app', dirs_exist_ok=True)
              shutil.copy2(source / 'stable-existing-app-adapter.js', preview / 'stable-existing-app-adapter.js')
              raise SystemExit(0)
          forecast = json.loads((source / 'current/forecast.json').read_text())
          if os.environ['REPLAY_CAPTURE'] == 'true':
              assert forecast['forecast_sha256'] == '79c047e172889aa517feab287b63c98606180c7e2ba691ddf784f1b93b19b1b1'
          assert forecast['gws'] == list(range(forecast['gws'][0], forecast['gws'][0] + 6))
          assert (source / 'current/forecast.json').read_bytes() == (source / 'gk/forecast.json').read_bytes()
          now = datetime.now(timezone.utc)
          cutoff = datetime.fromisoformat(forecast['data_asof'])
          assert cutoff <= now < min(cutoff + timedelta(hours=36), datetime.fromisoformat(forecast['origin_deadline']))
          site = Path('site')
          assert json.loads((site / 'current-players.json').read_text())['next_gw'] == forecast['gws'][0]
          assert json.loads((site / 'manager-service.json').read_text())['url'] == 'https://fpl-analytics-private-manager.onrender.com'
          preview = site / 'mm-preview'
          previous = json.loads((preview / 'current/forecast.json').read_text())
          assert datetime.fromisoformat(previous['data_asof']) <= cutoff, 'Refusing to roll the public forecast back'
          for name in ('app', 'current', 'gk', 'news'):
              shutil.copytree(source / name, preview / name, dirs_exist_ok=True)
          for asset in (*source.glob('*.js'), *source.glob('*.css')):
              shutil.copy2(asset, preview / asset.name)
          PYTHON
      - uses: actions/checkout@v4
        if: inputs.ui_only
        with:
          ref: ${{ github.sha }}
          path: ui-source
          sparse-checkout: integration/model-interface
          persist-credentials: false
      - name: Check the compact navigation on the normal Pages entry points
        if: inputs.ui_only
        run: |
          python ui-source/integration/model-interface/compact-root-ui.py site root-ui
          cp root-ui/* site/
          npm install --prefix "$RUNNER_TEMP/fpl-root-browser" playwright@1.56.1
          export NODE_PATH="$RUNNER_TEMP/fpl-root-browser/node_modules"
          export SITE_CHROME="$(command -v google-chrome)"
          python -m http.server 18098 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/fpl-root-http.log" 2>&1 &
          trap 'kill "$!"' EXIT
          node ui-source/integration/model-interface/compact-root-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: inputs.ui_only
        with:
          name: tested-root-ui
          path: root-ui
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: gw12-test-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the Pages artifact to appear in the run inventory
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: gw12-test-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..10}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" --jq '.total_count' | grep -qx 1; then
              sleep 8
              exit 0
            fi
            sleep 3
          done
          exit 1
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: gw12-test-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/checkout@v4
        with:
          ref: free-github-static-20261010
          path: live-preview-source
          sparse-checkout: app/mm-preview
      - name: Preserve the verified preview in the usual Pages source
        env:
          UI_ONLY: ${{ inputs.ui_only }}
        run: |
          preview=live-preview-source/app/mm-preview
          if [[ "$UI_ONLY" == true ]]; then
            cp -a tested-app/app/. "$preview/app/"
            cp tested-app/stable-existing-app-adapter.js "$preview/"
            git -C live-preview-source sparse-checkout add app
            cp root-ui/* live-preview-source/app/
          else
            cp -a tested-app/. "$preview/"
          fi
          git -C live-preview-source add -- app/mm-preview
          if [[ "$UI_ONLY" == true ]]; then
            for file in root-ui/*; do git -C live-preview-source add -- "app/${file##*/}"; done
          fi
          if git -C live-preview-source diff --cached --quiet; then exit 0; fi
          git -C live-preview-source -c user.name="FPL preview publisher" \
            -c user.email="fpl-preview@users.noreply.github.com" \
            commit -m "Preserve the verified FPL app test update [skip ci]"
          git -C live-preview-source push origin HEAD:free-github-static-20261010
  preview:
    needs: [current, verified]
    if: ${{ !inputs.app_completion_preview && always() && github.ref == 'refs/heads/main' && !cancelled() && (needs.current.result == 'success' || needs.verified.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: fpl-pages-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://pdamkier-del.github.io/fpl-analytics-app/mm-preview/app/transfers-classic.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_UI_SHA }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .c2-integration
          sparse-checkout: integration/model-interface
          persist-credentials: false
      - name: Require live isolated B compute capability
        run: |
          python - <<'PY'
          import json,urllib.request
          with urllib.request.urlopen('https://fpl-analytics-private-manager.onrender.com/health',timeout=90)as response:health=json.load(response)
          assert health.get('supports_B_snapshot_policy')is True, 'B snapshot backend must be deployed first'
          assert health.get('supports_unified_B_chain')is True, 'Unified B backend must be deployed before switching app forecasts'
          assert health.get('preview_worker_sha256')=='b3e67026e6c57e1c764d76bc2bf999ab7f4bcbaa739e3ab198ebe7fd5a95dbb7', 'Tested standalone B worker must be deployed'
          assert health.get('runtime')=='original_locked_python'and health.get('locked_model_active')is False
          PY
      - uses: actions/download-artifact@v4
        with:
          name: mm-current-live-preview
          path: .mm-preview-evidence
          run-id: ${{ inputs.validated_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: current-B-origin-input-evidence
          path: .B-origin-evidence
          run-id: ${{ inputs.validated_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require unchanged model mathematics and integrate reviewed UI only
        env:
          PYTHONPATH: src:scripts:.
        run: |
          git diff --exit-code "$PREVIEW_SOURCE_SHA" -- src model scripts/gk_joint_bridge.py scripts/gk_solo_role.py scripts/pm_preview_distributions.py scripts/run_joint_gk_preview.py scripts/mm_candidate_forecast.py scripts/mm_locked_bridge.py scripts/b_chain_contract.py scripts/b_preview_ts.py scripts/publish_mm_preview.py
          python scripts/check_snapshot_adapter.py
          pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests tabulate==0.10.0
          python scripts/restore_core_checkpoint.py
          cp app/mm-preview/desktop-probabilities.css "$RUNNER_TEMP/reviewed-probabilities.css"
          cp app/mm-preview/planner-experience.js "$RUNNER_TEMP/reviewed-planner-experience.js"
          cp app/mm-preview/dashboard-team-news.js "$RUNNER_TEMP/reviewed-team-news.js"
          cp app/mm-preview/latest-snapshot.js "$RUNNER_TEMP/reviewed-latest-snapshot.js"
          cp app/mm-preview/existing-app-adapter.js "$RUNNER_TEMP/reviewed-existing-adapter.js"
          cp app/mm-preview/gk/contract.js "$RUNNER_TEMP/reviewed-GK-contract.js"
          cp app/mm-preview/desktop-probabilities.js "$RUNNER_TEMP/reviewed-probabilities.js"
          cp app/mm-preview/player-match-card.js "$RUNNER_TEMP/reviewed-player-match-card.js"
          cp app/mm-preview/transfers-workspace.js "$RUNNER_TEMP/reviewed-transfers-workspace.js"
          cp app/mm-preview/transfers-workspace.css "$RUNNER_TEMP/reviewed-transfers-workspace.css"
          cp app/mm-preview/transfer-result-summary.js "$RUNNER_TEMP/reviewed-transfer-result-summary.js"
          cp app/mm-preview/player-match-context.js "$RUNNER_TEMP/reviewed-player-match-context.js"
          cp app/mm-preview/season-history-explorer.js "$RUNNER_TEMP/reviewed-season-history-explorer.js"
          cp app/mm-preview/season-history-explorer.css "$RUNNER_TEMP/reviewed-season-history-explorer.css"
          cp app/mm-preview/season-history-links.js "$RUNNER_TEMP/reviewed-season-history-links.js"
          cp app/mm-preview/weekly-review.js "$RUNNER_TEMP/reviewed-weekly-review.js"
          cp app/mm-preview/weekly-review.css "$RUNNER_TEMP/reviewed-weekly-review.css"
          cp app/mm-preview/player-season-review.js "$RUNNER_TEMP/reviewed-player-season-review.js"
          cp app/mm-preview/team-season-review.js "$RUNNER_TEMP/reviewed-team-season-review.js"
          cp app/mm-preview/season-team-comparison.js "$RUNNER_TEMP/reviewed-season-team-comparison.js"
          cp -R .mm-preview-evidence/. app/mm-preview/
          cp "$RUNNER_TEMP/reviewed-season-team-comparison.js" app/mm-preview/season-team-comparison.js
          cp "$RUNNER_TEMP/reviewed-team-season-review.js" app/mm-preview/team-season-review.js
          cp "$RUNNER_TEMP/reviewed-player-season-review.js" app/mm-preview/player-season-review.js
          cp "$RUNNER_TEMP/reviewed-weekly-review.js" app/mm-preview/weekly-review.js
          cp "$RUNNER_TEMP/reviewed-weekly-review.css" app/mm-preview/weekly-review.css
          cp "$RUNNER_TEMP/reviewed-player-match-context.js" app/mm-preview/player-match-context.js
          cp "$RUNNER_TEMP/reviewed-season-history-explorer.js" app/mm-preview/season-history-explorer.js
          cp "$RUNNER_TEMP/reviewed-season-history-explorer.css" app/mm-preview/season-history-explorer.css
          cp "$RUNNER_TEMP/reviewed-season-history-links.js" app/mm-preview/season-history-links.js
          cp "$RUNNER_TEMP/reviewed-transfers-workspace.js" app/mm-preview/transfers-workspace.js
          cp "$RUNNER_TEMP/reviewed-transfers-workspace.css" app/mm-preview/transfers-workspace.css
          cp "$RUNNER_TEMP/reviewed-transfer-result-summary.js" app/mm-preview/transfer-result-summary.js
          cp "$RUNNER_TEMP/reviewed-probabilities.js" app/mm-preview/desktop-probabilities.js
          cp "$RUNNER_TEMP/reviewed-player-match-card.js" app/mm-preview/player-match-card.js
          cp "$RUNNER_TEMP/reviewed-existing-adapter.js" app/mm-preview/existing-app-adapter.js
          cp "$RUNNER_TEMP/reviewed-GK-contract.js" app/mm-preview/gk/contract.js
          cp "$RUNNER_TEMP/reviewed-latest-snapshot.js" app/mm-preview/latest-snapshot.js
          cp "$RUNNER_TEMP/reviewed-probabilities.css" app/mm-preview/desktop-probabilities.css
          cp "$RUNNER_TEMP/reviewed-planner-experience.js" app/mm-preview/planner-experience.js
          cp "$RUNNER_TEMP/reviewed-team-news.js" app/mm-preview/dashboard-team-news.js
          python -c "import json;from pathlib import Path;from publish_unified_b_chain import synchronize_audit;synchronize_audit(Path('app/mm-preview/current'),json.loads(Path('app/mm-preview/current/forecast.json').read_text()))"
          python scripts/collect_player_match_context.py
          python scripts/build_preview_history_archive.py
          python analysis/audit_history_archive.py --archive app/mm-preview/history-archive --db work/core.sqlite3 --out unified-history-archive-reconciliation.json
          python analysis/audit_player_chain.py --capture app/mm-preview --inputs .B-origin-evidence/work/current-B-inputs --out app/mm-preview/input-audit --require-source-linkage
          python scripts/collect_dashboard_news.py
          git fetch origin free-github-static-20261010
          PYTHONPATH=src:scripts:.:analysis python scripts/weekly_model_review.py --ref FETCH_HEAD
          python scripts/integrate_desktop_probabilities.py
          python .c2-integration/integration/model-interface/preview-overlay.py app/mm-preview/app
          python analysis/archive_prospective_player_forecast.py --capture app/mm-preview --out app/mm-preview/input-audit
          cmp .mm-preview-evidence/current/forecast.json app/mm-preview/current/forecast.json
          cmp .mm-preview-evidence/gk/forecast.json app/mm-preview/gk/forecast.json
          cmp .mm-preview-evidence/gk/gk-mm.json app/mm-preview/gk/gk-mm.json
      - name: Verify actual existing desktop and mobile UI before publication
        env:
          PYTHONPATH: src:scripts:.
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q tests
          node tests/test_existing_B_adapter.js
          node tests/test_B_preview_contract.js
          node tests/test_joint_gk_contract.js
          node tests/test_season_team_comparison.js
          node tests/test_history_refresh_client.js
          node --test .c2-integration/integration/model-interface/*.test.js
          npm install --prefix "$RUNNER_TEMP/fpl-browser" playwright@1.56.1
          export NODE_PATH="$RUNNER_TEMP/fpl-browser/node_modules"
          export BROWSER_PATH="$(command -v google-chrome)"
          export DESKTOP_URL=http://127.0.0.1:18097/mm-preview/app/
          export DASHBOARD_TEST_FIXTURE="$RUNNER_TEMP/unified-private-browser-fixture.json"
          python analysis/prepare_dashboard_news_test.py --snapshot --forecast app/mm-preview/current/forecast.json --out "$DASHBOARD_TEST_FIXTURE"
          python -m http.server 18097 --bind 127.0.0.1 --directory app > "$RUNNER_TEMP/unified-browser-http.log" 2>&1 &
          preview_http_pid=$!
          trap 'kill "$preview_http_pid"' EXIT
          node analysis/verify_desktop_probabilities.cjs > unified-desktop-browser.json
          node analysis/verify_player_match_card.cjs > unified-player-match-card-browser.json
          node analysis/verify_penalty_split_card.cjs > unified-penalty-split-browser.json
          node analysis/verify_player_input_audit.cjs > unified-player-input-audit-browser.json
          node analysis/verify_player_match_context.cjs > unified-player-match-context-browser.json
          node analysis/verify_history_archive.cjs > unified-history-archive-browser.json
          node analysis/verify_unified_chain.cjs > unified-identity-browser.json
          node analysis/verify_latest_snapshot.cjs > unified-latest-snapshot-browser.json
          node analysis/verify_dashboard_workspace.cjs > unified-personal-dashboard-browser.json
          node analysis/verify_model_explainer.cjs > unified-model-explainer-browser.json
          node analysis/verify_transfer_result_summary.cjs > unified-transfer-result-browser.json
          node analysis/verify_transfer_chip_advice.cjs > unified-transfer-chip-browser.json
          node analysis/verify_weekly_model_review.cjs > unified-weekly-review-browser.json
          node analysis/verify_season_comparisons.cjs > unified-season-comparisons-browser.json
          node analysis/verify_current_season_backtest.cjs > unified-season-backtest-browser.json
          node tests/test_round_review.js
          node analysis/verify_round_review.cjs > unified-round-review-browser.json
          node - <<'JS' > unified-live-readiness-browser.json
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.BROWSER_PATH,headless:true,args:['--no-sandbox']});
            try{
              const page=await browser.newPage();let posts=0;
              await page.route('**/plans**',r=>{if(r.request().method()==='POST'){posts++;return r.abort();}return r.continue();});
              await page.goto(process.env.DESKTOP_URL+'transfers-classic.html',{waitUntil:'networkidle'});
              await page.locator('#planner-context').waitFor();
              const result=await page.evaluate(()=>{const s=FplManagerClient.snapshot();return {usable:s.usable,reason:s.reason,forecast_sha256:s.forecast.forecast_sha256,model:s.forecast.model,model_asof:s.forecast.data_asof};});
              assert.equal(result.model,'B-MM-PM-TS-v1');assert.equal(result.usable,true,JSON.stringify(result));assert.equal(posts,0);
              assert.match(await page.locator('#latest-snapshot-info').innerText(),/Prognose og priser/);
              console.log(JSON.stringify({...result,snapshot_window_usable:true,real_private_posts:posts},null,2));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=json.loads(Path('app/mm-preview/current/forecast.json').read_text())
          Path('app/mm-preview/chain-publication-sources.json').write_text(json.dumps(dict(model_source=os.environ['PREVIEW_SOURCE_SHA'],ui_source=os.environ['PREVIEW_UI_SHA'],forecast_sha256=f['forecast_sha256'],publication_run=os.environ['GITHUB_RUN_ID'],numerical_forecasts_byte_identical=True,production_model_unchanged=True),sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unified-B-browser-validation
          path: |
            unified-*-browser.json
            unified-history-archive-reconciliation.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: B-prospective-player-ledger
          path: |
            app/mm-preview/input-audit/prospective-ledger.jsonl.gz
            app/mm-preview/input-audit/prospective-ledger-manifest.json
          retention-days: 90
      - name: Publish preview alone; preserve every production asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_mm_preview.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .mm-preview-site
          name: mm-current-preview-pages-${{ github.run_id }}
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: mm-current-preview-pages-${{ github.run_id }}

  app_completion_verify:
    if: ${{ inputs.app_completion_preview && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fpl-app-completion-verification
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            integration/app-completion-20261126
            integration/model-interface
          persist-credentials: false
      - name: Resolve successful existing live Pages artifact
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python integration/app-completion-20261126/reviewed_baseline.py resolve --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.artifact }}
          run-id: ${{ steps.baseline.outputs.run }}
          github-token: ${{ github.token }}
          path: pages-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build preview without modifying any existing production file
        run: |
          mkdir site
          tar -xf pages-baseline/artifact.tar -C site
          python integration/app-completion-20261126/build_preview.py site --receipt preview-preservation.json
          python -m unittest discover -s integration/app-completion-20261126 -p "test_reviewed_baseline.py"
          node integration/app-completion-20261126/test_team_model.cjs
          node --test integration/model-interface/*.test.js
          for f in integration/app-completion-20261126/ui/*.js; do node --check "$f"; done
      - name: Browser check actual generated preview before publishing
        run: |
          pip install playwright==1.56.0
          python -m http.server 3000 --bind 127.0.0.1 --directory site > /tmp/preview-http.log 2>&1 &
          python integration/app-completion-20261126/browser_smoke.py http://127.0.0.1:3000/previews/team-transfers-20261126/app/ "$(command -v google-chrome)" > preview-browser.json
      - uses: actions/upload-artifact@v4
        with:
          name: app-completion-verification
          path: |
            preview-preservation.json
            preview-browser.json
      - uses: actions/upload-artifact@v4
        with:
          name: app-completion-tested-site
          path: site
          include-hidden-files: true
          retention-days: 3
  app_completion_publish:
    needs: app_completion_verify
    if: ${{ inputs.app_completion_preview && inputs.publish_app_completion_preview && needs.app_completion_verify.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: fpl-pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://pdamkier-del.github.io/fpl-analytics-app/previews/team-transfers-20261126/app/overview.html
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: integration/app-completion-20261126
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: app-completion-tested-site
          path: site
      - name: Refuse to replace an advanced live baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python integration/app-completion-20261126/reviewed_baseline.py guard --site site
      - uses: actions/upload-pages-artifact@v3
        with:
          name: app-completion-pages-${{ github.run_id }}
          path: site
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: app-completion-pages-${{ github.run_id }}
