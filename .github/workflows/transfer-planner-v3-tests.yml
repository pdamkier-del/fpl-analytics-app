name: transfer planner v3 tests

on:
  push:
    branches:
      - audit-role-minutes-20261001
    paths:
      - src/fpl_xpts/transfer_planner.py
      - tests/test_transfer_planner.py
      - .github/workflows/transfer-planner-v3-tests.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
      - name: Run planner tests
        run: pytest -q tests/test_transfer_planner.py tests/test_season_replay.py
