name: vFinal strategy oracle gap
on:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_vfinal_oracle_gap.py'
      - '.github/workflows/vfinal-oracle-gap.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-model-checkpoint.txt
      - name: Download model replay
        uses: actions/download-artifact@v4
        with:
          name: pm-ts-vfinal-fullhorizon-proxy
          path: analysis/results/oracle_inputs/model
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37445455546
      - name: Download baseline state replay
        uses: actions/download-artifact@v4
        with:
          name: ts-v4-joint-replay-resumed
          path: analysis/results/oracle_inputs/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37433364153
      - run: PYTHONPATH=src python scripts/run_vfinal_oracle_gap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vfinal-oracle-gap
          path: analysis/results/vfinal-oracle-gap-gw22-38-20261006-v1
