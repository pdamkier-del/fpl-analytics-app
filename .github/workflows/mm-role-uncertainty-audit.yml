name: MM-only role uncertainty and large error audit
on:
  push:
    branches: [research-mm-role-uncertainty-audit-20261017]
    paths:
      - scripts/research_mm_role_uncertainty_audit.py
      - .github/workflows/mm-role-uncertainty-audit.yml
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONPATH: src:scripts:.
  OPENBLAS_NUM_THREADS: '1'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - name: Audit fixed 39,264 MM predictions, no model training
        run: |
          sha256sum analysis/results/individual-mm-refinement-20261016/predictions.npz > /tmp/inputs.sha
          python scripts/research_mm_role_uncertainty_audit.py
          sha256sum --check /tmp/inputs.sha
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mm-role-uncertainty-audit
          path: analysis/results/mm-role-uncertainty-20261017/
      - name: Commit observed results
        run: |
          git config user.name 'FPL MM research evidence'
          git config user.email 'research-evidence@users.noreply.github.com'
          git add analysis/results/mm-role-uncertainty-20261017/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish role-stratified MM error analysis'
          git push origin HEAD:research-mm-role-uncertainty-audit-20261017
