name: WC extended TS season replay

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_wc_ts_action_replay.py'
      - 'scripts/run_fh_exact_gap_reference.py'
      - '.github/workflows/wc-ts-action-replay.yml'
      - 'src/fpl_xpts/wildcard_ts_action.py'
      - 'src/fpl_xpts/wildcard_planner_v2.py'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas==2.2.3 numpy==2.3.5 scipy scikit-learn requests
      - name: Download locked 2125 chain
        uses: actions/download-artifact@v4
        with:
          name: final-locked-chain-gw1-38
          path: work/locked2125
          github-token: ${{ github.token }}
          run-id: 37612845586
      - name: Run 2025-26 raw FH xP-gap replay
        run: |
          VF=$(find work/locked2125 -name rolling_vfinal_forecast.csv.gz | head -1)
          test -n "$VF"
          rm -rf analysis/results/wc-ts-action-replay
          PYTHONPATH=src:scripts python scripts/run_wc_ts_action_replay.py --vfinal "$VF" --out analysis/results/wc-ts-action-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wc-ts-action-replay
          path: |
            analysis/results/wc-ts-action-replay
          retention-days: 90
