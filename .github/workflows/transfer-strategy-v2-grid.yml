name: TS v2 9-way replay grid

on:
  push:
    branches:
      - audit-role-minutes-20261001
    paths:
      - scripts/run_transfer_strategy_v2_grid.py
      - .github/workflows/transfer-strategy-v2-grid.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-model-checkpoint.txt
          pip install -r requirements-model-tests.txt
      - name: Run TS v2 grid
        run: python scripts/run_transfer_strategy_v2_grid.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/results/transfer-strategy-v2-grid-20261005-v1
          git commit -m "results: lineup-aware transfer strategy v2 grid" || exit 0
          git push origin HEAD:audit-role-minutes-20261001
