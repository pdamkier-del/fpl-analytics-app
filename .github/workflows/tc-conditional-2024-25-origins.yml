name: TC conditional 2024-25 origins

on:
  workflow_dispatch:
  push:
    branches: [audit-role-minutes-20261001]
    paths:
      - 'scripts/run_2024_25_tc_long_horizon_origin.py'
      - '.github/workflows/tc-conditional-2024-25-origins.yml'

jobs:
  origin:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {origin: 6, end: 19}
          - {origin: 7, end: 19}
          - {origin: 8, end: 19}
          - {origin: 9, end: 19}
          - {origin: 10, end: 19}
          - {origin: 11, end: 19}
          - {origin: 12, end: 19}
          - {origin: 13, end: 19}
          - {origin: 14, end: 19}
          - {origin: 15, end: 19}
          - {origin: 16, end: 19}
          - {origin: 17, end: 19}
          - {origin: 18, end: 19}
          - {origin: 19, end: 19}
          - {origin: 20, end: 38}
          - {origin: 21, end: 38}
          - {origin: 22, end: 38}
          - {origin: 23, end: 38}
          - {origin: 24, end: 38}
          - {origin: 25, end: 38}
          - {origin: 26, end: 38}
          - {origin: 27, end: 38}
          - {origin: 28, end: 38}
          - {origin: 29, end: 38}
          - {origin: 30, end: 38}
          - {origin: 31, end: 38}
          - {origin: 32, end: 38}
          - {origin: 33, end: 38}
          - {origin: 34, end: 38}
          - {origin: 35, end: 38}
          - {origin: 36, end: 38}
          - {origin: 37, end: 38}
          - {origin: 38, end: 38}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-role-minutes-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements-model-checkpoint.txt
          pip install pandas numpy scipy scikit-learn requests
      - name: Restore inputs
        run: |
          mkdir -p work
          cat model/checkpoints/phase5e_core/parts/core.gz.part-* | gzip -dc > work/core.sqlite3
          python scripts/restore_2024_25_data_checkpoint.py
      - name: Download verified 2024/25 MM
        uses: actions/download-artifact@v4
        with:
          name: conditional-2024-25-mm
          path: work/mm24
          github-token: ${{ github.token }}
          run-id: 37635030493
      - name: Run TC origin
        run: |
          PYTHONPATH=src python scripts/run_2024_25_tc_long_horizon_origin.py \
            --db work/core.sqlite3 \
            --derived data_v1_1/derived/season_2024_25_v1 \
            --source work/mm24/conditional_feature_frame.csv.gz \
            --mm work/mm24/locked_mm_predictions.csv.gz \
            --out analysis/results/tc24-origin-${{ matrix.origin }} \
            --origin ${{ matrix.origin }} --period-end ${{ matrix.end }} \
            --draws 400 --top-k 20
      - uses: actions/upload-artifact@v4
        with:
          name: tc24-origin-${{ matrix.origin }}
          path: analysis/results/tc24-origin-${{ matrix.origin }}
          retention-days: 30
