name: MM integrated preview validation
on:
  push:
    branches: [integration-mm-preview-20261017]
    paths:
      - scripts/mm_candidate*.py
      - scripts/build_mm_integration_preview.py
      - scripts/replay_mm_candidate_calibration.py
      - scripts/publish_mm_preview.py
      - tests/test_mm_candidate.py
      - app/mm-preview/**
      - .github/workflows/mm-integration-preview.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
env:
  PYTHONPATH: src:scripts:.
  OPENBLAS_NUM_THREADS: '1'
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-model-checkpoint.txt -r requirements-model-tests.txt requests
      - name: MM-only regression, source, identity and leakage tests
        run: >-
          python -m pytest -q tests/test_mm_candidate.py tests/test_individual_mm_refinement.py
          tests/test_club_match_importance.py tests/test_mm_competition_rotation.py
          tests/test_mm_all_clubs.py tests/test_mm_probability_robustness.py
          tests/test_mm_role_injury_integration.py tests/test_research_role_injury_club_audit.py
          tests/test_team_news_history.py tests/test_team_news_audit.py
      - name: Refit B at every evaluation origin with identical previous-label cutoffs
        run: python scripts/replay_mm_candidate_calibration.py
      - name: Execute six-arm common pipeline and full probabilistic/XI evaluation
        run: python scripts/build_mm_integration_preview.py
      - name: Preserve all production code, forecasts and frozen inputs
        run: |
          git diff --exit-code 56d637ad52502ffd8fd1de85216b6e6aafade62f -- src service model analysis/results/individual-mm-refinement-20261016
          node --check app/mm-preview/preview.js
      - uses: actions/upload-artifact@v4
        with:
          name: mm-integration-preview-evidence
          path: |
            analysis/results/mm-integration-preview-20261017/
            app/mm-preview/
      - name: Preserve only public MM evidence on integration branch
        run: |
          git config user.name 'FPL MM integration evidence'
          git config user.email 'mm-evidence@users.noreply.github.com'
          git add analysis/results/mm-integration-preview-20261017/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve integrated MM replay, runtime parity and calibration gates'
          git push origin HEAD:integration-mm-preview-20261017
  preview:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fpl-pages-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://pdamkier-del.github.io/fpl-analytics-app/mm-preview/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: mm-integration-preview-evidence
          path: .mm-preview-evidence
      - name: Stage public preview from the actual validated calculation
        run: |
          mkdir -p app/mm-preview
          cp -R .mm-preview-evidence/app/mm-preview/. app/mm-preview/
      - name: Overlay preview only; keep every existing production byte identical
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_mm_preview.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .mm-preview-site
          name: mm-preview-pages-${{ github.run_id }}
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: mm-preview-pages-${{ github.run_id }}
