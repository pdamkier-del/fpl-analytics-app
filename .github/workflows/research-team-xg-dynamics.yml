name: Historical team xG dynamics experiment
on:
  push:
    branches: [research-team-xg-dynamics-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python analysis/team_xg_dynamics_experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: team-xg-dynamics-results
          path: team-xg-dynamics-results.json
