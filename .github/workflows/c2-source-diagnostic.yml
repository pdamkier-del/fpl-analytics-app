name: C2 diagnose rejected public GW12 source
on:
  push:
    branches: [integration/stable-live-app-20261122]
    paths: [.github/workflows/c2-source-diagnostic.yml]
permissions:
  actions: read
  contents: read
jobs:
  finding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 45542763882
          name: current-B-public-input-and-validation-evidence
          github-token: ${{ github.token }}
          path: evidence
      - name: Reproduce the availability-cap check on exact original rows
        run: |
          python - <<'PY'
          import csv, gzip, json
          from pathlib import Path
          root = Path('evidence/work')
          gk = root / 'joint-gk-current'
          forecast = json.loads((gk / 'forecast.json').read_text())
          assert forecast['forecast_sha256'] == 'd1ac16fa3914b40d2a77975420f20c446b75e47151126a63fe2a495d65df0dcf'
          mm = json.loads((gk / 'gk-mm.json').read_text())
          rows = {(row['player_id'], row['fixture_id']): row for row in mm['players']}
          players = {row['player_uuid']: row for row in forecast['players']}
          findings = []
          with gzip.open(root / 'current-B-inputs/target.csv.gz', 'rt') as stream:
              for target in csv.DictReader(stream):
                  key = target['player_uuid'], target['fixture_uuid']
                  if target['news_eligible'] != 'True' or not target['news_chance'] or key not in rows:
                      continue
                  cap = float(target['news_chance']) / 100
                  probability = rows[key]['p_play']
                  if probability > cap + 0.000001:
                      player = players[key[0]]
                      findings.append(dict(player=player['name'], element=player['id'], fixture=key[1],
                                           gw=target['gw'], cap=cap, p_start=rows[key]['p_start'], p_play=probability))
          print(json.dumps(findings, indent=2))
          assert len(findings) == 1, 'Expected the sole archived availability finding'
          PY
