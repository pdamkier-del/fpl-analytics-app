<html><head><script src="../existing-app-adapter.js?v=desktop-probabilities-2"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixtures · FPL Analytics</title><link rel="stylesheet" href="assets.css">
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#101820;--muted:#6d7882;--line:#e4e9ed;--green:#087a52;--soft:#eaf7f1;--nav:#0b1720;--nav2:#172733;--shadow:0 10px 32px rgba(15,29,40,.06)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}
.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}.sidebar{background:var(--nav);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:18px;margin:0 8px 28px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#61ddb0,#16845e);display:grid;place-items:center;color:#05251a;font-size:13px}.nav-title{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#708797;margin:22px 12px 8px}.nav a{display:block;margin:3px 0;padding:11px 12px;border-radius:9px;color:#9cafbb;font-size:14px}.nav a.active,.nav a:hover{background:var(--nav2);color:#fff}.sidebar-foot{position:absolute;left:20px;right:20px;bottom:22px;color:#728998;font-size:11px;line-height:1.55}
.main{padding:28px 34px 52px;min-width:0}.crumb{font-size:13px;color:var(--muted);margin-bottom:18px}.hero{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}.meta{text-align:center;color:var(--muted);font-size:12px}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;margin-top:16px}.team{text-align:center}.crest{width:82px;height:82px;margin:0 auto 10px;display:grid;place-items:center}.team-name{font-size:21px;font-weight:900}.score{font-size:44px;font-weight:950;letter-spacing:-.04em}.status{margin-top:6px;font-size:11px;color:var(--green);font-weight:800}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:18px 0}.tab{all:unset;cursor:pointer;padding:12px 15px;font-size:13px;font-weight:800;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:var(--green);border-color:var(--green)}.view{display:none}.view.active{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-title{font-weight:850}.panel-sub{font-size:11px;color:var(--muted);margin-top:2px}.panel-body{padding:16px}.badge{font-size:10px;padding:6px 8px;border-radius:999px;background:var(--soft);color:var(--green);font-weight:850}
.pitch{position:relative;min-height:520px;border-radius:18px;overflow:hidden;padding:18px 10px;background:repeating-linear-gradient(0deg,#14734f 0,#14734f 12.5%,#11704b 12.5%,#11704b 25%);border:1px solid #0c6745}.pitch:before{content:"";position:absolute;inset:16px;border:1px solid rgba(255,255,255,.44)}.pitch:after{content:"";position:absolute;left:16px;right:16px;top:50%;height:1px;background:rgba(255,255,255,.36)}.line{position:relative;z-index:2;display:flex;justify-content:space-around;gap:7px;margin:12px 0}.node{width:94px;text-align:center}.node .asset-face-pitch{margin:0 auto 5px}.name{font-size:10px;font-weight:850;color:#fff;background:rgba(4,19,14,.82);padding:5px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shirt-no{font-size:8px;color:#d9eee4;margin-top:3px}.formation{text-align:center;color:#d8eee4;font-size:10px;font-weight:850;margin-bottom:4px}.bench-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.bench-player{border:1px solid var(--line);border-radius:10px;padding:9px;display:flex;gap:8px;align-items:center}.bench-player strong{font-size:11px}.bench-player small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.stat-row{display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf0f2;font-size:12px}.stat-row:last-child{border-bottom:0}.stat-home{text-align:right;font-weight:850}.stat-away{text-align:left;font-weight:850}.stat-label{text-align:center;color:var(--muted);font-size:10px;text-transform:uppercase}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.card-label{font-size:10px;color:var(--muted);font-weight:850;text-transform:uppercase}.card-value{font-size:22px;font-weight:900;margin-top:4px}.notice{padding:12px 14px;border:1px dashed #b9c5cd;border-radius:12px;color:var(--muted);font-size:11px;line-height:1.5;background:#fbfcfd}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:920px;font-size:12px}th,td{padding:10px;border-bottom:1px solid #edf0f2;text-align:right}th{background:#f8fafb;font-size:10px;text-transform:uppercase;color:#5c6871}th:first-child,td:first-child{text-align:left}.click{cursor:pointer}.click:hover td{background:#fbfcfc}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.bench-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:820px){.app{grid-template-columns:78px 1fr}.sidebar{padding:20px 10px}.brand span,.nav a span,.nav-title,.sidebar-foot{display:none}.brand{margin-left:9px}.nav a{width:42px;text-align:center;margin:5px auto}.main{padding:18px 12px 42px}.scoreboard{gap:10px}.crest{width:62px;height:62px}.team-name{font-size:16px}.score{font-size:34px}.cards{grid-template-columns:1fr 1fr}.pitch{min-height:450px}.node{width:72px}.name{font-size:9px}}
